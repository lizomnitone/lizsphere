<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">

<link rel="stylesheet" href="styles.css">
<title>Home</title>

<style>
/* ---------- Lightbox ---------- */
.artwork { cursor: zoom-in; }

.lightbox {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.9);
}
/* Needed because display:flex above would otherwise override the hidden attribute */
.lightbox[hidden] { display: none; }

.lightbox-figure {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.lightbox-img {
  display: block;
  max-width: 90vw;
  max-height: 78vh;
  width: auto;
  height: auto;
  object-fit: contain;
}
.lightbox-caption {
  color: #fff;
  text-align: center;
  max-width: 70ch;
  padding: 0 16px;
}
.lightbox-caption p { margin: 0; }
.lightbox-caption .lb-sub { font-size: 0.9rem; opacity: 0.75; margin-top: 4px; }

.lightbox-btn {
  position: absolute;
  width: 48px;
  height: 48px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  font-size: 28px;
  line-height: 48px;
  text-align: center;
  cursor: pointer;
}
.lightbox-btn:hover,
.lightbox-btn:focus-visible { background: rgba(255, 255, 255, 0.3); }
.lightbox-btn[hidden] { display: none; }
.lightbox-close { top: 16px; right: 16px; }
.lightbox-prev  { left: 16px;  top: 50%; margin-top: -24px; }
.lightbox-next  { right: 16px; top: 50%; margin-top: -24px; }

@media (max-width: 600px) {
  .lightbox-prev, .lightbox-next { top: auto; bottom: 16px; margin-top: 0; }
}
</style>
</head>
<body>

<div class="page-container">
<div class="home-header">
<h1 class="home-header-title">Artworks</h1>
</div>

<div class="bubbles-container" id="bubbles-container"></div>
<div class="gallery" id="gallery"></div>
<div class="home-header">
  <h1 class="home-header-title">Photos</h1>
</div>
<div class="gallery" id="photos-gallery"></div>
</div>

<!-- Lightbox markup -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <button type="button" class="lightbox-btn lightbox-close" id="lb-close" aria-label="Close">&times;</button>
  <button type="button" class="lightbox-btn lightbox-prev" id="lb-prev" aria-label="Previous image">&#8249;</button>
  <figure class="lightbox-figure">
    <img class="lightbox-img" id="lb-img" alt="">
    <figcaption class="lightbox-caption" id="lb-caption"></figcaption>
  </figure>
  <button type="button" class="lightbox-btn lightbox-next" id="lb-next" aria-label="Next image">&#8250;</button>
</div>

<script>
// --- 1. Define your bubbles here. Any field you omit gets randomized. ---
const bubbles = [
  {
    href: "index.html",
    label: "Back to Home",
    colors: ["#FF4400", "#FFB300", "#FCD06A", "#FF4400"],
    size: 180,
    rotateDuration: 3000,
    floatAngle: 350,
    floatDuration: 15,
    // size, colors, float*, rotateDuration all omitted on purpose -> randomized below
  },

];



// --- 2. Randomization helpers + fallback ranges ---
function randomBetween(min, max) {
  return Math.random() * (max - min) + min;
}

function randomColorSet() {
  // random hue-rotated 4-stop palette, evenly spaced, first/last matched to loop cleanly
  const hue = Math.floor(randomBetween(0, 360));
  const c1 = `hsl(${hue}, 85%, 55%)`;
  const c2 = `hsl(${(hue + 90) % 360}, 85%, 55%)`;
  const c3 = `hsl(${(hue + 200) % 360}, 85%, 55%)`;
  return [c1, c2, c3, c1];
}

function fillDefaults(bubble) {
  return {
    href: bubble.href,
    label: bubble.label,
    size: bubble.size ?? Math.round(randomBetween(160, 280)),
    colors: bubble.colors ?? randomColorSet(),
    floatDistance: bubble.floatDistance ?? Math.round(randomBetween(15, 50)),
    floatAngle: bubble.floatAngle ?? Math.round(randomBetween(0, 360)),
    floatDuration: bubble.floatDuration ?? +randomBetween(4, 9).toFixed(1),
    rotateDuration: bubble.rotateDuration ?? Math.round(randomBetween(3000, 6000)),
  };
}

// --- 3. Template: builds one bubble's markup with unique IDs + per-bubble CSS variables ---
function createBubbleSVG(rawBubble, index) {
  const uid = `bubble-${index}`;
  const b = fillDefaults(rawBubble);

  // Convert angle+distance into an x/y drift offset (px)
  const angleRad = (b.floatAngle * Math.PI) / 180;
  const floatX = (b.floatDistance * Math.cos(angleRad)).toFixed(1);
  const floatY = (b.floatDistance * Math.sin(angleRad)).toFixed(1);

  const [c1, c2, c3, c4] = b.colors;

  // CSS custom properties, set inline so each bubble can differ without a separate stylesheet rule
  const wrapperStyle = `
    --float-x: ${floatX}px;
    --float-y: ${floatY}px;
    --float-duration: ${b.floatDuration}s;
  `.replace(/\s+/g, ' ');

  const textFontSize = Math.round((b.size / 270) * 22); // scales text proportionally to bubble size

  return `
    <a href="${b.href}" class="sphere-link">
      <div class="sphere-wrapper" style="${wrapperStyle}">
        <svg class="sphere-svg" data-gradient-id="grad-${uid}" data-rotate-duration="${b.rotateDuration}"
             viewBox="0 0 250 250" width="${b.size}" height="${b.size}">
          <defs>
            <filter id="warp-${uid}" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" />
            </filter>

            <clipPath id="clip-${uid}">
              <circle cx="125" cy="125" r="120" />
            </clipPath>

            <linearGradient id="grad-${uid}" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="repeat">
              <stop offset="0%" stop-color="${c1}" />
              <stop offset="33.3%" stop-color="${c2}" />
              <stop offset="66.6%" stop-color="${c3}" />
              <stop offset="100%" stop-color="${c4}" />
            </linearGradient>

            <radialGradient id="shading-${uid}" cx="40%" cy="35%" r="75%">
              <stop offset="0%" stop-color="#000000" stop-opacity="0" />
              <stop offset="65%" stop-color="#000000" stop-opacity="0" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
            </radialGradient>

            <radialGradient id="highlight-${uid}" cx="32%" cy="28%" r="30%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>

            <filter id="shadow-${uid}" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
            </filter>
          </defs>

          <circle cx="125" cy="125" r="120" fill="#000000" opacity="0" filter="url(#shadow-${uid})" />

          <g clip-path="url(#clip-${uid})">
            <rect x="-20" y="-50" width="300" height="350" fill="url(#grad-${uid})" filter="url(#warp-${uid})" />
            <circle cx="125" cy="125" r="120" fill="url(#shading-${uid})" />
            <circle cx="125" cy="125" r="120" fill="url(#highlight-${uid})" />
          </g>

          <text class="bubble-text" x="125" y="125" text-anchor="middle" dominant-baseline="middle"
                style="font-size: ${textFontSize}px;">
            ${b.label}
          </text>
        </svg>
      </div>
    </a>
  `;
}

// --- 4. Render all bubbles into the container ---
const container = document.getElementById('bubbles-container');
container.innerHTML = bubbles.map((b, i) => createBubbleSVG(b, i)).join('');

// --- 5. One animation loop drives ALL gradients, each at its own rotateDuration ---
let startTime = null;

function animateAllGradients(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;

  document.querySelectorAll('[data-gradient-id]').forEach(svg => {
    const gradId = svg.dataset.gradientId;
    const duration = Number(svg.dataset.rotateDuration) || 4000;
    const progress = (elapsed % duration) / duration;
    const gradEl = document.getElementById(gradId);
    if (gradEl) gradEl.setAttribute('gradientTransform', `translate(${-progress} 0)`);
  });

  requestAnimationFrame(animateAllGradients);
}

requestAnimationFrame(animateAllGradients);

// --- Gallery: list your artworks here ---
const artworks = [
  { src: "artwork/piece-1.jpg", title: "Abstract #1", text: "Acrylic on canvas, 2022" },
  { src: "artwork/plants-1.jpg", title: "Plants #1", text: "Acrylic on canvas, 2023" },
  { src: "artwork/beach-boardwalk.png", title: "Beach Boardwalk", text: "TY Card, 2024" },
  { src: "artwork/conundrum.png", title: "Sailor", text: "Watercolour, 2024" },
  { src: "artwork/curtains.png", title: "Curtains", text: "Cotton/Sewing, 2026" },
  { src: "artwork/elm-cafe.png", title: "The Elm Cafe", text: "TY Card, 2024" },
  { src: "artwork/galaxie-diner.png", title: "The Galaxie Diner", text: "Acrylic + Ink, 2026" },
  { src: "artwork/fused-glass-bowl.png", title: "Fused Glass Bowl", text: "Glass, 2025" },
  { src: "artwork/ferry.jpeg", title: "Wolfe Island Ferry", text: "TY Card, 2024" },
  { src: "artwork/tech-art-1.png", title: "Interactive Sculpture", text: "Mixed Media, 2022" },
  { src: "artwork/collage-house.png", title: "House", text: "Paper, 2024" },
  { src: "artwork/japan-1.png", title: "Japan #1", text: "TY Card, 2024" },
  { src: "artwork/lotus-lamp.jpeg", title: "Lotus Lamp", text: "PLA, acrylic, electronics, stained glass, 2025" },
  { src: "artwork/neon.jpeg", title: "Neon", text: "Acrylic, 2022" },
  { src: "artwork/niece.jpeg", title: "Violette", text: "Acrylic, 2023" },
  { src: "artwork/pink-and-blue.png", title: "Pink & Blue", text: "Acrylic, 2022" },
  { src: "artwork/pink-light.jpeg", title: "Pink Light", text: "Walnut, Holographic Vinyl, Electronics, Brass, Braided Cable, Glass" },
  { src: "artwork/run.jpeg", title: "Mati", text: "Acrylic, 2023" },
  { src: "artwork/spanish-flea.png", title: "Spanish Flea", text: "Acrylic, 2023" },
  { src: "artwork/studio.jpeg", title: "Synth Studio", text: "Watercolour + Ink, 2024" },
  { src: "artwork/fused-glass-sailboat.png", title: "Fused Glass Sailboat", text: "Glass, 2025" },
  { src: "artwork/tristan.jpeg", title: "Tristan", text: "Watercolour + Ink, 2024" },
  { src: "artwork/trip.png", title: "Trip", text: "Acrylic, 2023" },
  { src: "artwork/wedding-website.png", title: "Wedding Website", text: "Digital, 2026" },
  { src: "artwork/fields.jpeg", title: "Fields", text: "Acrylic, 2023" },
  { src: "artwork/22.png", title: "22", text: "Acrylic, 2022" },
  { src: "artwork/peace.png", title: "Peace", text: "Acrylic, 2022" },
  { src: "artwork/plants-2.jpeg", title: "Plants #2", text: "Acrylic, 2023" },
  { src: "artwork/synth-studio-2.png", title: "Synth Studio #2", text: "Digital, 2024" },
  { src: "artwork/self.jpeg", title: "Self", text: "Digital, 2020" },
  // add more...
];


// --- Photos: list your files here ---
const photos = [
  { src: "photos/photo-1.jpg", alt: "Description of photo 1" },
  { src: "photos/photo-2.jpeg", alt: "Description of photo 2" },
  { src: "photos/photo-3.jpeg", alt: "Description of photo 3" },
  { src: "photos/photo-4.jpeg", alt: "Description of photo 4" },
  { src: "photos/photo-5.jpeg", alt: "Description of photo 5" },
  { src: "photos/photo-6.jpeg", alt: "Description of photo 6" },
  { src: "photos/photo-7.jpeg", alt: "Description of photo 7" },
  { src: "photos/photo-8.jpeg", alt: "Description of photo 8" },
  { src: "photos/photo-9.jpeg", alt: "Description of photo 9" },
];


// ======================= Lightbox =======================
const lightboxEl = document.getElementById('lightbox');
const lbImg      = document.getElementById('lb-img');
const lbCaption  = document.getElementById('lb-caption');
const lbPrev     = document.getElementById('lb-prev');
const lbNext     = document.getElementById('lb-next');
const lbClose    = document.getElementById('lb-close');

let lbItems = [];          // the items of whichever gallery was clicked
let lbIndex = 0;
let lbShowCaptions = true;
let lbLastFocused = null;

function lbShow(index) {
  const n = lbItems.length;
  lbIndex = ((index % n) + n) % n; // wraps in both directions
  const item = lbItems[lbIndex];

  lbImg.src = item.src;
  lbImg.alt = item.alt ?? item.title ?? '';

  lbCaption.textContent = '';
  if (lbShowCaptions) {
    if (item.title) {
      const t = document.createElement('p');
      t.textContent = item.title;
      lbCaption.append(t);
    }
    if (item.text) {
      const s = document.createElement('p');
      s.className = 'lb-sub';
      s.textContent = item.text;
      lbCaption.append(s);
    }
  }

  // Preload neighbours so arrow navigation feels instant
  if (n > 1) {
    [lbIndex - 1, lbIndex + 1].forEach(i => {
      new Image().src = lbItems[((i % n) + n) % n].src;
    });
  }
}

function lbOpen(items, index, showCaptions) {
  lbItems = items;
  lbShowCaptions = showCaptions;
  lbLastFocused = document.activeElement;

  const multiple = items.length > 1;
  lbPrev.hidden = !multiple;
  lbNext.hidden = !multiple;

  lbShow(index);
  lightboxEl.hidden = false;
  document.body.style.overflow = 'hidden';
  lbClose.focus();
}

function lbCloseFn() {
  lightboxEl.hidden = true;
  lbImg.removeAttribute('src');
  document.body.style.overflow = '';
  if (lbLastFocused && lbLastFocused.focus) lbLastFocused.focus();
}

lbPrev.addEventListener('click', () => lbShow(lbIndex - 1));
lbNext.addEventListener('click', () => lbShow(lbIndex + 1));
lbClose.addEventListener('click', lbCloseFn);

// Clicking the dark backdrop (not the image or buttons) closes
lightboxEl.addEventListener('click', e => {
  if (e.target === lightboxEl) lbCloseFn();
});

document.addEventListener('keydown', e => {
  if (lightboxEl.hidden) return;
  if (e.key === 'Escape') lbCloseFn();
  else if (e.key === 'ArrowLeft'  && lbItems.length > 1) lbShow(lbIndex - 1);
  else if (e.key === 'ArrowRight' && lbItems.length > 1) lbShow(lbIndex + 1);
});

// Touch swipe (horizontal, 50px threshold)
let lbTouchX = null;
lightboxEl.addEventListener('touchstart', e => { lbTouchX = e.touches[0].clientX; }, { passive: true });
lightboxEl.addEventListener('touchend', e => {
  if (lbTouchX === null || lbItems.length < 2) return;
  const dx = e.changedTouches[0].clientX - lbTouchX;
  lbTouchX = null;
  if (Math.abs(dx) > 50) lbShow(lbIndex + (dx < 0 ? 1 : -1));
}, { passive: true });


// ======================= Gallery rendering =======================
// Same markup as before; each figure now also opens the lightbox when clicked.
function renderGallery(containerId, items, { showCaptions = true } = {}) {
  const galleryEl = document.getElementById(containerId);

  items.forEach((item, index) => {
    const fig = document.createElement('figure');
    fig.className = 'artwork';
    fig.tabIndex = 0;
    fig.setAttribute('role', 'button');
    fig.setAttribute('aria-label', `View ${item.title ?? item.alt ?? 'image'} larger`);

    const img = document.createElement('img');
    img.src = item.src;
    img.alt = item.alt ?? item.title ?? '';
    img.loading = 'lazy';
    fig.append(img);

    if (showCaptions) {
      const title = document.createElement('p');
      title.className = 'artwork-title';
      title.textContent = item.title ?? '';
      fig.append(title);

      if (item.text) {
        const text = document.createElement('p');
        text.className = 'artwork-text';
        text.textContent = item.text;
        fig.append(text);
      }
    }

    const open = () => lbOpen(items, index, showCaptions);
    fig.addEventListener('click', open);
    fig.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });

    galleryEl.append(fig);
  });
}

renderGallery('gallery', artworks);
renderGallery('photos-gallery', photos, { showCaptions: false });
</script>

</body>
</html>
