<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient y2="100%" x2="0%" y1="0%" x1="0%" id="nodeGradient">
      <stop style="stop-color:#4a9eff;stop-opacity:1" offset="0%"></stop>
      <stop style="stop-color:#2d7dd2;stop-opacity:1" offset="100%"></stop>
    </linearGradient>
    
    
    <linearGradient y2="100%" x2="0%" y1="0%" x1="0%" id="senderGradient">
      <stop style="stop-color:#67d99e;stop-opacity:1" offset="0%"></stop>
      <stop style="stop-color:#3cb371;stop-opacity:1" offset="100%"></stop>
    </linearGradient>
    
    
    <linearGradient y2="100%" x2="0%" y1="0%" x1="0%" id="receiverGradient">
      <stop style="stop-color:#ff7e67;stop-opacity:1" offset="0%"></stop>
      <stop style="stop-color:#e85d4c;stop-opacity:1" offset="100%"></stop>
    </linearGradient>
    
    
    <marker orient="auto" refY="3.5" refX="9" markerHeight="7" markerWidth="10" id="arrowhead">
      <polygon fill="#6b7280" points="0 0, 10 3.5, 0 7"></polygon>
    </marker>
    
    
    <filter height="200%" width="200%" y="-50%" x="-50%" id="glow">
      <feGaussianBlur result="coloredBlur" stdDeviation="3"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    
    
    <pattern patternUnits="userSpaceOnUse" height="20" width="20" y="0" x="0" id="waves">
      <circle opacity="0.5" fill="#e0e7ff" r="1" cy="10" cx="10"></circle>
    </pattern>
  </defs>
  
  
  <rect fill="#f8fafc" height="400" width="800"></rect>
  
  
  <rect fill="url(#waves)" height="400" width="800"></rect>
  
  
  
  <line marker-end="url(#arrowhead)" stroke-dasharray="8,4" stroke-width="2" stroke="#94a3b8" y2="120" x2="250" y1="200" x1="130"></line>
  
  
  <line marker-end="url(#arrowhead)" stroke-dasharray="8,4" stroke-width="2" stroke="#94a3b8" y2="200" x2="390" y1="120" x1="310"></line>
  
  
  <line marker-end="url(#arrowhead)" stroke-dasharray="8,4" stroke-width="2" stroke="#94a3b8" y2="280" x2="550" y1="200" x1="470"></line>
  
  
  <line marker-end="url(#arrowhead)" stroke-dasharray="8,4" stroke-width="2" stroke="#94a3b8" y2="200" x2="690" y1="280" x1="610"></line>
  
  
  <text font-weight="500" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif" y="145" x="175">hop 1</text>
  <text font-weight="500" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif" y="145" x="340">hop 2</text>
  <text font-weight="500" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif" y="225" x="500">hop 3</text>
  <text font-weight="500" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif" y="225" x="640">hop 4</text>
  
  
  <g filter="url(#glow)">
    
    <rect stroke-width="2" stroke="#2d8a5e" fill="url(#senderGradient)" rx="8" height="80" width="50" y="165" x="70"></rect>
    
    <rect fill="#e8f5e9" rx="3" height="55" width="38" y="175" x="76"></rect>
    
    <rect fill="#2d8a5e" rx="1.5" height="3" width="16" y="169" x="87"></rect>
    
    <rect fill="#3cb371" rx="3" height="18" width="26" y="185" x="82"></rect>
    <circle fill="white" r="2" cy="194" cx="88"></circle>
    <circle fill="white" r="2" cy="194" cx="95"></circle>
    <circle fill="white" r="2" cy="194" cx="102"></circle>
  </g>
  <text font-weight="600" text-anchor="middle" fill="#166534" font-size="13" font-family="system-ui, -apple-system, sans-serif" y="270" x="95">Sender</text>
  <text text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, -apple-system, sans-serif" y="285" x="95">(your phone)</text>
  
  
  <g filter="url(#glow)">
    
    <rect stroke-width="2" stroke="#1e5a9e" fill="url(#nodeGradient)" rx="6" height="60" width="45" y="85" x="255"></rect>
    
    <line stroke-linecap="round" stroke-width="3" stroke="#1e5a9e" y2="55" x2="277" y1="85" x1="277"></line>
    <circle fill="#1e5a9e" r="4" cy="52" cx="277"></circle>
    
    <path opacity="0.7" fill="none" stroke-width="2" stroke="#93c5fd" d="M 290 70 Q 300 60, 295 50"></path>
    <path opacity="0.5" fill="none" stroke-width="2" stroke="#93c5fd" d="M 295 75 Q 310 60, 302 45"></path>
    
    <rect fill="#dbeafe" rx="2" height="25" width="33" y="95" x="261"></rect>
    
    <circle fill="#22c55e" r="3" cy="132" cx="277"></circle>
  </g>
  <text font-weight="500" text-anchor="middle" fill="#1e40af" font-size="12" font-family="system-ui, -apple-system, sans-serif" y="165" x="277">Node 1</text>
  
  
  <g filter="url(#glow)">
    
    <rect stroke-width="2" stroke="#1e5a9e" fill="url(#nodeGradient)" rx="6" height="60" width="45" y="165" x="408"></rect>
    
    <line stroke-linecap="round" stroke-width="3" stroke="#1e5a9e" y2="135" x2="430" y1="165" x1="430"></line>
    <circle fill="#1e5a9e" r="4" cy="132" cx="430"></circle>
    
    <path opacity="0.7" fill="none" stroke-width="2" stroke="#93c5fd" d="M 443 150 Q 453 140, 448 130"></path>
    <path opacity="0.5" fill="none" stroke-width="2" stroke="#93c5fd" d="M 448 155 Q 463 140, 455 125"></path>
    
    <rect fill="#dbeafe" rx="2" height="25" width="33" y="175" x="414"></rect>
    
    <circle fill="#22c55e" r="3" cy="212" cx="430"></circle>
  </g>
  <text font-weight="500" text-anchor="middle" fill="#1e40af" font-size="12" font-family="system-ui, -apple-system, sans-serif" y="245" x="430">Node 2</text>
  
  
  <g filter="url(#glow)">
    
    <rect stroke-width="2" stroke="#1e5a9e" fill="url(#nodeGradient)" rx="6" height="60" width="45" y="245" x="558"></rect>
    
    <line stroke-linecap="round" stroke-width="3" stroke="#1e5a9e" y2="215" x2="580" y1="245" x1="580"></line>
    <circle fill="#1e5a9e" r="4" cy="212" cx="580"></circle>
    
    <path opacity="0.7" fill="none" stroke-width="2" stroke="#93c5fd" d="M 593 230 Q 603 220, 598 210"></path>
    <path opacity="0.5" fill="none" stroke-width="2" stroke="#93c5fd" d="M 598 235 Q 613 220, 605 205"></path>
    
    <rect fill="#dbeafe" rx="2" height="25" width="33" y="255" x="564"></rect>
    
    <circle fill="#22c55e" r="3" cy="292" cx="580"></circle>
  </g>
  <text font-weight="500" text-anchor="middle" fill="#1e40af" font-size="12" font-family="system-ui, -apple-system, sans-serif" y="325" x="580">Node 3</text>
  
  
  <g filter="url(#glow)">
    
    <rect stroke-width="2" stroke="#c94434" fill="url(#receiverGradient)" rx="8" height="80" width="50" y="165" x="680"></rect>
    
    <rect fill="#fef2f2" rx="3" height="55" width="38" y="175" x="686"></rect>
    
    <rect fill="#c94434" rx="1.5" height="3" width="16" y="169" x="697"></rect>
    
    <rect fill="#e85d4c" rx="3" height="18" width="26" y="185" x="692"></rect>
    <text text-anchor="middle" fill="white" font-size="10" font-family="system-ui, -apple-system, sans-serif" y="198" x="705">✓</text>
    
    <circle fill="#22c55e" r="6" y="183" cx="716"></circle>
    <text font-weight="bold" text-anchor="middle" fill="white" font-size="8" font-family="system-ui, -apple-system, sans-serif" y="186" x="716">1</text>
  </g>
  <text font-weight="600" text-anchor="middle" fill="#991b1b" font-size="13" font-family="system-ui, -apple-system, sans-serif" y="270" x="705">Receiver</text>
  <text text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, -apple-system, sans-serif" y="285" x="705">(friend's phone)</text>
  
  
  <text font-weight="600" text-anchor="middle" fill="#1e293b" font-size="18" font-family="system-ui, -apple-system, sans-serif" y="35" x="400">How Meshtastic Relays Messages</text>
  
  
  <text font-style="italic" text-anchor="middle" fill="#64748b" font-size="12" font-family="system-ui, -apple-system, sans-serif" y="380" x="400">Messages hop from node to node until they reach their destination</text>
  
  
  <g transform="translate(30, 330)">
    <rect fill="url(#senderGradient)" rx="2" height="12" width="12" y="0" x="0"></rect>
    <text fill="#64748b" font-size="10" font-family="system-ui, -apple-system, sans-serif" y="10" x="18">Your device</text>
    
    <rect fill="url(#nodeGradient)" rx="2" height="12" width="12" y="0" x="85"></rect>
    <text fill="#64748b" font-size="10" font-family="system-ui, -apple-system, sans-serif" y="10" x="103">Relay nodes</text>
    
    <rect fill="url(#receiverGradient)" rx="2" height="12" width="12" y="0" x="180"></rect>
    <text fill="#64748b" font-size="10" font-family="system-ui, -apple-system, sans-serif" y="10" x="198">Recipient</text>
  </g>
</svg>