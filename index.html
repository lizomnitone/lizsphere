<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<title>Home</title>
</head>
<body>

<div class="page-container">
<div class="home-header">
<hh>Hi, I'm Liz</hh>
<p>Welcome to my digital sphere</p>
</div>

<!--sphere svg #2-->
<a href="/synthesizers.html" class="sphere-link">
<div class = "sphere-wrapper">
<svg class="sphere-svg" viewBox="0 0 250 250" width="270" height="270">
<defs>
<filter id="spherical-warp" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
<feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" />
</filter>


<clipPath id="sphere-clip">
<circle cx="125" cy="125" r="120" />
</clipPath>

<linearGradient id="sphere-grad" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="repeat">
<stop offset="0%" stop-color="#ff0055" />
<stop offset="33.3%" stop-color="#00daff" />
<stop offset="66.6%" stop-color="#7a00ff" />
<stop offset="100%" stop-color="#ff0055" />
</linearGradient>

<!-- Radial shading: dark rim, transparent center -->
<radialGradient id="sphere-shading" cx="40%" cy="35%" r="75%">
<stop offset="0%" stop-color="#000000" stop-opacity="0" />
<stop offset="65%" stop-color="#000000" stop-opacity="0" />
<stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
</radialGradient>

<!-- Specular highlight -->
<radialGradient id="sphere-highlight" cx="32%" cy="28%" r="30%">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
<stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
</radialGradient>

<!-- Drop shadow filter for grounding -->
<filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
<feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
</filter>
</defs>

<!-- Shadow sits behind everything -->
<circle cx="125" cy="125" r="120" fill="#000000" opacity="0" filter="url(#drop-shadow)" />

<g clip-path="url(#sphere-clip)">
<rect x="-20" y="-50" width="300" height="350" fill="url(#sphere-grad)" filter="url(#spherical-warp)" />
<!-- Shading overlay, clipped to same circle -->
<circle cx="125" cy="125" r="120" fill="url(#sphere-shading)" />
<!-- Highlight overlay -->
<circle cx="125" cy="125" r="120" fill="url(#sphere-highlight)" />
</g>

<text class="bubble-text" x="125" y="125" text-anchor="middle" dominant-baseline="middle">
        Synthesizers
      </text>
</svg>
</div>
</a>

<!--this script only works for sphere 1-->
<script>
const gradient = document.getElementById('sphere-grad');
const durationMs = 4000; // matches your original 4s
let startTime = null;

function animateGradient(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = (timestamp - startTime) % durationMs;
  const progress = elapsed / durationMs; // 0 to 1
  const translateX = -progress; // moves left by one full period, loops seamlessly

  gradient.setAttribute('gradientTransform', `translate(${translateX} 0)`);
  requestAnimationFrame(animateGradient);
}

requestAnimationFrame(animateGradient);
</script>


</body>
</html>
