        body {

            background-color: #fffef7;
            background-image: url('../assets/images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            color: #333;
        }

        @keyframes softFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .resource-item { animation: none !important; }
        }

        h1 { text-align: center; font-size: 2.5em; margin: 0; }

        nav { text-align: center; margin: 40px 0; }
        nav a {
            margin: 0 20px;
            text-decoration: none;
            color: #333;
            font-weight: 700;
            font-size: 1.1em;
            transition: color 0.3s ease;
        }
        nav a:hover { color: #888; }

        .design-section {
            background-color: rgba(245, 240, 230, 0.3);
            border-radius: 30px;
            padding: 40px 30px;
            margin-bottom: 60px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }
        .section-title { font-size: 1.8em; font-weight: 700; }


        /* Resource cards */
        .resources-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .resource-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px;
            min-height: 72px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.5);
            transition: background-color 0.2s ease;
            animation: softFloat 5s ease-in-out infinite;
        }
        .resource-item:nth-child(5n+1) { animation-delay: 0s; }
        .resource-item:nth-child(5n+2) { animation-delay: 0.2s; }
        .resource-item:nth-child(5n+3) { animation-delay: 0.4s; }
        .resource-item:nth-child(5n+4) { animation-delay: 0.6s; }
        .resource-item:nth-child(5n+5) { animation-delay: 0.8s; }
        .resource-item:hover { background-color: rgba(255, 255, 255, 0.85); animation: none; }

        .resource-item img { width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; }
        .resource-item a {
            flex-grow: 1;
            min-width: 0;
            text-decoration: none;
            color: inherit;
        }
        .resource-name {
            font-weight: 700;
            margin-bottom: 2px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .resource-domain {
            font-size: 0.85em;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty { grid-column: 1 / -1; text-align: center; color: #777; }
    </style>

    <script>
        function getDomain(url) {
            try { return new URL(url).hostname.replace(/^www\./, ''); }
            catch (e) { return url; }
        }

        function render() {
            const text = document.getElementById('links').textContent;
            const doc = new DOMParser().parseFromString(text, 'text/html');
            const seen = new Set();
            const items = [];
            doc.querySelectorAll('a[href]').forEach(a => {
                const link = a.getAttribute('href').trim();
                // http(s) only; skip exact duplicates
                if (!/^https?:\/\//i.test(link) || seen.has(link)) return;
                seen.add(link);
                items.push({ link, name: a.textContent.trim() || getDomain(link) });
            });

            const container = document.getElementById('resources-container');
            document.getElementById('count').textContent = items.length ? '(' + items.length + ')' : '';

            if (!items.length) {
                const p = document.createElement('p');
                p.className = 'empty';
                p.textContent = 'No links found in the #links block.';
                container.appendChild(p);
                return;
            }

            items.forEach(item => {
                const domain = getDomain(item.link);
                const card = document.createElement('div');
                card.className = 'resource-item';

                const icon = document.createElement('img');
                icon.src = 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(domain);
                icon.alt = '';
                icon.loading = 'lazy';
                icon.onerror = () => { icon.style.visibility = 'hidden'; };

                const a = document.createElement('a');
                a.href = item.link;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';

                const name = document.createElement('div');
                name.className = 'resource-name';
                name.textContent = item.name;

                const dom = document.createElement('div');
                dom.className = 'resource-domain';
                dom.textContent = domain;

                a.append(name, dom);
                card.append(icon, a);
                container.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
