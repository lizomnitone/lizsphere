<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<title>Home</title>
</head>
<body>

<div class="page-container">
<div class="header-text">
<h1>Hi, I'm Liz</h1>
<p>Welcome to my digital sphere</p>
</div>

<svg class="sphere-svg" viewBox="0 0 250 250" width="250" height="250">
<defs>
<filter id="spherical-warp" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
<feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" />
</filter>

<clipPath id="sphere-clip">
<circle cx="125" cy="125" r="120" />
</clipPath>

<linearGradient id="sphere-grad" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="repeat">
<stop offset="0%" stop-color="#ff0055" />
<stop offset="33.3%" stop-color="#00daff" />
<stop offset="66.6%" stop-color="#7a00ff" />
<stop offset="100%" stop-color="#ff0055" />
</linearGradient>
</defs>

<g clip-path="url(#sphere-clip)">
<rect x="-20" y="-50" width="300" height="350" fill="url(#sphere-grad)" filter="url(#spherical-warp)" />
</g>
</svg>
</div>

<script>
const gradient = document.getElementById('sphere-grad');
const durationMs = 4000; // matches your original 4s
let startTime = null;

function animateGradient(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = (timestamp - startTime) % durationMs;
  const progress = elapsed / durationMs; // 0 to 1
  const translateX = -progress; // moves left by one full period, loops seamlessly

  gradient.setAttribute('gradientTransform', `translate(${translateX} 0)`);
  requestAnimationFrame(animateGradient);
}

requestAnimationFrame(animateGradient);
</script>

</body>
</html>
