<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/lizsphere/">
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<title>Home</title>
</head>
<body>

<div class="page-container">
<div class="home-header">
<h1 class="home-header-title">Hi, I'm Liz</h1>
<p>Welcome to my digital sphere(s)</p>
</div>

<div class="bubbles-container" id="bubbles-container"></div>
</div>

<script>
// --- 1. Define your bubbles here. Any field you omit gets randomized. ---
const bubbles = [
  {
    href: "satellite-home.html",
    label: "Satellites",
    size: 220,
  },
  {
    href: "synthesizers.html",
    label: "Synthesizers",
    size: 260,
    colors: ["#ff0055", "#00daff", "#7a00ff", "#ff0055"],
  },

  {
    href: "design-gallery.html",
    label: "Design Gallery",
    size: 200,
    colors: ["#ffb703", "#fb8500", "#ff006e", "#ffb703"],
  },
  {
    href: "artwork.html",
    label: "Artwork",
    size: 230,
  },
  {
    href: "https://ca.pinterest.com/lizizthename/",
    label: "Pinterest",
    size: 180,
  },
  {
    href: "workshops.html",
    label: "Workshops around Town",
    size: 180,
    colors: ["#ffb703", "#fb8500", "#ff006e", "#ffb703"],
  },
  
];

// --- 2. Randomization helpers + fallback ranges ---
function randomBetween(min, max) {
  return Math.random() * (max - min) + min;
}

function randomColorSet() {
  // random hue-rotated 4-stop palette, evenly spaced, first/last matched to loop cleanly
  const hue = Math.floor(randomBetween(0, 360));
  const c1 = `hsl(${hue}, 85%, 55%)`;
  const c2 = `hsl(${(hue + 90) % 360}, 85%, 55%)`;
  const c3 = `hsl(${(hue + 200) % 360}, 85%, 55%)`;
  return [c1, c2, c3, c1];
}

function fillDefaults(bubble) {
  return {
    href: bubble.href,
    label: bubble.label,
    size: bubble.size ?? Math.round(randomBetween(160, 280)),
    colors: bubble.colors ?? randomColorSet(),
    floatDistance: bubble.floatDistance ?? Math.round(randomBetween(15, 50)),
    floatAngle: bubble.floatAngle ?? Math.round(randomBetween(0, 360)),
    floatDuration: bubble.floatDuration ?? +randomBetween(4, 9).toFixed(1),
    rotateDuration: bubble.rotateDuration ?? Math.round(randomBetween(3000, 6000)),
  };
}

// --- 3. Template: builds one bubble's markup with unique IDs + per-bubble CSS variables ---
function createBubbleSVG(rawBubble, index) {
  const uid = `bubble-${index}`;
  const b = fillDefaults(rawBubble);

  // Convert angle+distance into an x/y drift offset (px)
  const angleRad = (b.floatAngle * Math.PI) / 180;
  const floatX = (b.floatDistance * Math.cos(angleRad)).toFixed(1);
  const floatY = (b.floatDistance * Math.sin(angleRad)).toFixed(1);

  const [c1, c2, c3, c4] = b.colors;

  // CSS custom properties, set inline so each bubble can differ without a separate stylesheet rule
  const wrapperStyle = `
    --float-x: ${floatX}px;
    --float-y: ${floatY}px;
    --float-duration: ${b.floatDuration}s;
  `.replace(/\s+/g, ' ');

  const textFontSize = Math.round((b.size / 270) * 22); // scales text proportionally to bubble size

  return `
  <div class="drag-layer">
    <a href="${b.href}" class="sphere-link">
  
    <a href="${b.href}" class="sphere-link">
      <div class="sphere-wrapper" style="${wrapperStyle}">
        <svg class="sphere-svg" data-gradient-id="grad-${uid}" data-rotate-duration="${b.rotateDuration}"
             viewBox="0 0 250 250" width="${b.size}" height="${b.size}">
          <defs>
            <filter id="warp-${uid}" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" />
            </filter>

            <clipPath id="clip-${uid}">
              <circle cx="125" cy="125" r="120" />
            </clipPath>

            <linearGradient id="grad-${uid}" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="repeat">
              <stop offset="0%" stop-color="${c1}" />
              <stop offset="33.3%" stop-color="${c2}" />
              <stop offset="66.6%" stop-color="${c3}" />
              <stop offset="100%" stop-color="${c4}" />
            </linearGradient>

            <radialGradient id="shading-${uid}" cx="40%" cy="35%" r="75%">
              <stop offset="0%" stop-color="#000000" stop-opacity="0" />
              <stop offset="65%" stop-color="#000000" stop-opacity="0" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
            </radialGradient>

            <radialGradient id="highlight-${uid}" cx="32%" cy="28%" r="30%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>

            <filter id="shadow-${uid}" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
            </filter>
          </defs>

          <circle cx="125" cy="125" r="120" fill="#000000" opacity="0" filter="url(#shadow-${uid})" />

          <g clip-path="url(#clip-${uid})">
            <rect x="-20" y="-50" width="300" height="350" fill="url(#grad-${uid})" filter="url(#warp-${uid})" />
            <circle cx="125" cy="125" r="120" fill="url(#shading-${uid})" />
            <circle cx="125" cy="125" r="120" fill="url(#highlight-${uid})" />
          </g>

          <text class="bubble-text" x="125" y="125" text-anchor="middle" dominant-baseline="middle"
                style="font-size: ${textFontSize}px;">
            ${b.label}
          </text>
        </svg>
      </div>
    </a>
    </a>
  </div>
  `;
}

// --- 4. Render all bubbles into the container ---
const container = document.getElementById('bubbles-container');
container.innerHTML = bubbles.map((b, i) => createBubbleSVG(b, i)).join('');

// --- 5. One animation loop drives ALL gradients, each at its own rotateDuration ---
let startTime = null;

function animateAllGradients(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;

  document.querySelectorAll('[data-gradient-id]').forEach(svg => {
    const gradId = svg.dataset.gradientId;
    const duration = Number(svg.dataset.rotateDuration) || 4000;
    const progress = (elapsed % duration) / duration;
    const gradEl = document.getElementById(gradId);
    if (gradEl) gradEl.setAttribute('gradientTransform', `translate(${-progress} 0)`);
  });

  requestAnimationFrame(animateAllGradients);
}

requestAnimationFrame(animateAllGradients);

// --- 6. Drag interaction ---
// --- 6. Bubble-physics drag ---
const CFG = {
  dragThreshold: 5,        // px before a press counts as a drag
  stiffness: 20,           // lower = more lag/resistance
  damping: 10,              // higher = less wobble (critical damping ≈ 2·√stiffness ≈ 12.6)
  friction: 1.6,           // per-second decay after release; higher = stops sooner
  maxSpeed: 1500,          // px/s cap so a flick can't launch it across the screen
  stretchPerSpeed: 0.0001, // squash/stretch amount per px/s
  maxStretch: 0.18,        // 0.18 = up to 18% elongation
  homePull: 0,             // >0 gently drifts bubbles back to their start (try 0.3)
  restSpeed: 2             // px/s below which the animation loop stops
};

let zCounter = 1;
const states = [];
let rafId = null;
let lastTs = 0;

function render(s) {
  const speed = Math.hypot(s.vx, s.vy);
  const k = Math.min(speed * CFG.stretchPerSpeed, CFG.maxStretch);
  const ang = Math.atan2(s.vy, s.vx);
  s.layer.style.transform =
    `translate3d(${s.x}px, ${s.y}px, 0) rotate(${ang}rad) ` +
    `scale(${1 + k}, ${1 / (1 + k)}) rotate(${-ang}rad)`;
}

function step(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05); // clamp so tab-switches don't explode the sim
  lastTs = ts;
  let active = false;

  for (const s of states) {
    if (s.pressed && s.dragged) {
      // damped spring toward the pointer-defined target
      s.vx += (CFG.stiffness * (s.tx - s.x) - CFG.damping * s.vx) * dt;
      s.vy += (CFG.stiffness * (s.ty - s.y) - CFG.damping * s.vy) * dt;
    } else {
      // free motion: exponential friction (frame-rate independent) + optional home pull
      const f = Math.exp(-CFG.friction * dt);
      s.vx *= f;
      s.vy *= f;
      if (CFG.homePull) {
        s.vx -= CFG.homePull * s.x * dt;
        s.vy -= CFG.homePull * s.y * dt;
      }
    }

    const speed = Math.hypot(s.vx, s.vy);
    if (speed > CFG.maxSpeed) {
      s.vx *= CFG.maxSpeed / speed;
      s.vy *= CFG.maxSpeed / speed;
    }

    s.x += s.vx * dt;
    s.y += s.vy * dt;
    render(s);

    const homeDist = CFG.homePull ? Math.hypot(s.x, s.y) : 0;
    if (s.pressed || speed > CFG.restSpeed || homeDist > 0.5) active = true;
    else { s.vx = s.vy = 0; render(s); } // settle: remove residual stretch
  }

  rafId = active ? requestAnimationFrame(step) : null;
}

function wake() {
  if (rafId === null) {
    lastTs = performance.now();
    rafId = requestAnimationFrame(step);
  }
}

container.querySelectorAll('.drag-layer').forEach(layer => {
  const s = {
    layer,
    wrapper: layer.querySelector('.sphere-wrapper'),
    x: 0, y: 0, vx: 0, vy: 0,   // current position/velocity (offset from natural layout spot)
    tx: 0, ty: 0,               // spring target while dragging
    startX: 0, startY: 0, baseX: 0, baseY: 0,
    pressed: false, dragged: false
  };
  states.push(s);

  layer.addEventListener('dragstart', e => e.preventDefault());

  layer.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    s.pressed = true;
    s.dragged = false;
    s.startX = e.clientX; s.startY = e.clientY;
    s.baseX = s.x;        s.baseY = s.y;
    s.tx = s.x;           s.ty = s.y;
    layer.setPointerCapture(e.pointerId);
    wake();
  });

  layer.addEventListener('pointermove', e => {
    if (!s.pressed) return;
    const dx = e.clientX - s.startX;
    const dy = e.clientY - s.startY;
    if (!s.dragged) {
      if (Math.hypot(dx, dy) < CFG.dragThreshold) return;
      s.dragged = true;
      layer.classList.add('dragging');
      layer.style.zIndex = ++zCounter;
      s.wrapper.style.animationPlayState = 'paused';
    }
    s.tx = s.baseX + dx;
    s.ty = s.baseY + dy;
  });

  const endPress = () => {
    if (!s.pressed) return;
    s.pressed = false;
    layer.classList.remove('dragging');
    s.wrapper.style.animationPlayState = '';
    setTimeout(() => { s.dragged = false; }, 0); // lets the trailing click be suppressed
    wake();
  };
  layer.addEventListener('pointerup', endPress);
  layer.addEventListener('pointercancel', endPress);

  layer.addEventListener('click', e => {
    if (s.dragged) { e.preventDefault(); e.stopPropagation(); }
  }, true);
});
</script>

</body>
</html>
