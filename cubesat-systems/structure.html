<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/lizsphere/">
<link rel="stylesheet" href="styles.css">
<title>CubeSat Structure</title>
<style>
  /* Local adjustments that rely strictly on your existing CSS variables */
  .wiki-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
  }

  .wiki-card-body {
    flex-grow: 1;
  }

  .wiki-card-footer {
    margin-top: 16px;
    padding-top: 8px;
    border-top: 1px solid var(--card-border);
    font-size: 0.8rem;
    opacity: 0.6;
    font-family: monospace;
  }

  .wiki-columns-inner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 8px;
  }

  @media (max-width: 600px) {
    .wiki-columns-inner {
      grid-template-columns: 1fr;
    }
  }

  .wiki-columns-inner ul {
    padding-left: 18px;
    margin-top: 6px;
  }

  .wiki-columns-inner li {
    font-size: 0.88rem;
    margin-bottom: 4px;
  }

  .wiki-media-caption {
    font-size: 0.75rem;
    opacity: 0.7;
    text-align: center;
    margin-top: 6px;
    font-family: monospace;
  }
</style>
</head>
<body>

<div class="page-container voicebox-page">

  <!-- HEADER -->
  <header class="home-header">
    <h1 class="home-header-title">CubeSat Structure</h1>
    <p>Structural frameworks, launcher rail mechanics & form factors</p>
  </header>

  <!-- PINNED TOP-RIGHT BUBBLES -->
  <div class="bubbles-container bubbles-pinned-top-right" id="bubbles-container"></div>
  <!-- MAIN CONTENT GRID -->
  <div class="content-grid" id="wiki-feed">
    <!-- Dynamic wiki entries populate here -->
  </div>

</div>

<!-- IMAGE LIGHTBOX MODAL -->
<div class="modal-overlay hidden" id="image-modal">
  <div class="modal-content image-modal-content">
    <button class="modal-close" onclick="closeImageModal()" aria-label="Close image">&times;</button>
    <img id="lightbox-image" src="" alt="">
  </div>
</div>

<script>
// ============================================================
// TOP-RIGHT NAVIGATION BUBBLES
// ============================================================
const bubbles = [
  {
    href: "index.html",
    label: "Back to Home",
    colors: ["#ff0055", "#7a00ff", "#7a00ff", "#ff0055"],
    size: 85,
    minFontSize: 14,
    pinned: true,
    floatDistance: 5,
  }, 
  {
    href: "satellite-home.html",
    label: "Sat Home",
    colors: ["#ff0055", "#7a00ff", "#7a00ff", "#ff0055"],
    size: 85,
    minFontSize: 14,
    pinned: true,
    floatDistance: 5,
  }
];

function randomBetween(min, max) {
  return Math.random() * (max - min) + min;
}

function randomColorSet() {
  const hue = Math.floor(randomBetween(0, 360));
  const c1 = `hsl(${hue}, 85%, 55%)`;
  const c2 = `hsl(${(hue + 90) % 360}, 85%, 55%)`;
  const c3 = `hsl(${(hue + 200) % 360}, 85%, 55%)`;
  return [c1, c2, c3, c1];
}

function fillDefaults(bubble) {
  return {
    href: bubble.href,
    label: bubble.label,
    size: bubble.size ?? Math.round(randomBetween(160, 280)),
    colors: bubble.colors ?? randomColorSet(),
    floatDistance: bubble.floatDistance ?? Math.round(randomBetween(15, 50)),
    floatAngle: bubble.floatAngle ?? Math.round(randomBetween(0, 360)),
    floatDuration: bubble.floatDuration ?? +randomBetween(4, 9).toFixed(1),
    rotateDuration: bubble.rotateDuration ?? Math.round(randomBetween(3000, 6000)),
  };
}

function createBubbleSVG(rawBubble, index) {
  const uid = `bubble-${index}`;
  const b = fillDefaults(rawBubble);
  const angleRad = (b.floatAngle * Math.PI) / 180;
  const floatX = (b.floatDistance * Math.cos(angleRad)).toFixed(1);
  const floatY = (b.floatDistance * Math.sin(angleRad)).toFixed(1);
  const [c1, c2, c3, c4] = b.colors;
  const wrapperStyle = `--float-x: ${floatX}px; --float-y: ${floatY}px; --float-duration: ${b.floatDuration}s;`;
  
  const calculatedFont = Math.round((b.size / 130) * 26);
  const minFont = rawBubble.minFontSize || 14;
  const textFontSize = Math.max(calculatedFont, minFont);

  const pinnedClass = b.pinned ? ' sphere-wrapper--pinned' : '';

  return `
    <a href="${b.href}" class="sphere-link${b.pinned ? ' sphere-link--pinned' : ''}">
      <div class="sphere-wrapper${pinnedClass}" style="${wrapperStyle}">
        <svg class="sphere-svg" data-gradient-id="grad-${uid}" data-rotate-duration="${b.rotateDuration}"
             viewBox="0 0 250 250" width="${b.size}" height="${b.size}">
          <defs>
            <filter id="warp-${uid}" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <clipPath id="clip-${uid}"><circle cx="125" cy="125" r="120" /></clipPath>
            <linearGradient id="grad-${uid}" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="repeat">
              <stop offset="0%" stop-color="${c1}" />
              <stop offset="33.3%" stop-color="${c2}" />
              <stop offset="66.6%" stop-color="${c3}" />
              <stop offset="100%" stop-color="${c4}" />
            </linearGradient>
            <radialGradient id="shading-${uid}" cx="40%" cy="35%" r="75%">
              <stop offset="0%" stop-color="#000000" stop-opacity="0" />
              <stop offset="65%" stop-color="#000000" stop-opacity="0" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
            </radialGradient>
            <radialGradient id="highlight-${uid}" cx="32%" cy="28%" r="30%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <filter id="shadow-${uid}" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
            </filter>
          </defs>
          <circle cx="125" cy="125" r="120" fill="#000000" opacity="0" filter="url(#shadow-${uid})" />
          <g clip-path="url(#clip-${uid})">
            <rect x="-20" y="-50" width="300" height="350" fill="url(#grad-${uid})" filter="url(#warp-${uid})" />
            <circle cx="125" cy="125" r="120" fill="url(#shading-${uid})" />
            <circle cx="125" cy="125" r="120" fill="url(#highlight-${uid})" />
          </g>
          <text class="bubble-text" x="125" y="125" text-anchor="middle" dominant-baseline="middle"
                style="font-size: ${textFontSize}px;">${b.label}</text>
        </svg>
      </div>
    </a>
  `;
}

document.getElementById('bubbles-container').innerHTML =
  bubbles.map((b, i) => createBubbleSVG(b, i)).join('');

let bubbleStartTime = null;
function animateAllGradients(timestamp) {
  if (!bubbleStartTime) bubbleStartTime = timestamp;
  const elapsed = timestamp - bubbleStartTime;
  document.querySelectorAll('[data-gradient-id]').forEach(svg => {
    const duration = Number(svg.dataset.rotateDuration) || 4000;
    const progress = (elapsed % duration) / duration;
    const gradEl = document.getElementById(svg.dataset.gradientId);
    if (gradEl) gradEl.setAttribute('gradientTransform', `translate(${-progress} 0)`);
  });
  requestAnimationFrame(animateAllGradients);
}
requestAnimationFrame(animateAllGradients);


// ============================================================
// WIKI DATABASE
// ============================================================
const wikiEntries = [
  {
    id: "structural-form-factors",
    category: "Structure",
    title: "CubeSat Form Factors & Mass Classes",
    date: "Reference Note",
    image: "cubesat-systems/cubesat-u.jpeg",
    imageCaption: "Standard aluminum chassis frame & rails",
    content: `
      <div class="wiki-columns-inner">
        <div>
          <strong style="font-family: monospace;">Standard 'U' Formats</strong>
          <ul>
            <li><b>1U:</b> 10×10×11.35 cm</li>
            <li><b>2U:</b> 10×10×22.7 cm</li>
            <li><b>3U:</b> 10×10×34.0 cm</li>
            <li><b>6U:</b> 10×20×34.0 cm</li>
            <li><b>12U:</b> 20×20×34.0 cm</li>
          </ul>
        </div>
        <div>
          <strong style="font-family: monospace;">Broader Weight Classes</strong>
          <ul>
            <li><b>Femtosat:</b> &lt;100g</li>
            <li><b>Picosat:</b> 0.1kg - 1kg</li>
            <li><b>Nanosat:</b> 1kg - 10kg</li>
            <li><b>Microsat:</b> 10kg - 100kg</li>
          </ul>
        </div>
      </div>
    `
  },
  {
    id: "aluminum-frame-mounting",
    category: "Structure",
    title: "Aluminum Frame Alloys & Mounting Strategies",
    date: "Reference Note",
    image: "cubesat-systems/cubesat-u.jpeg",
    imageCaption: "Standard anodized aluminum chassis frame & rails",
    content: `
      <div class="wiki-columns-inner">
        <div>
          <strong style="font-family: monospace;">Material Selection</strong>
          <ul>
            <li><b>Alloy Choice:</b> <b>Aluminum 6061-T6</b> or <b>7075-T6</b> is mandatory to match the CTE (Coefficient of Thermal Expansion) of launcher pod rails.</li>
            <li><b>Anodization Rule:</b> Outer rails touch dispenser walls and MUST be Hard Anodized (Type III) to prevent cold welding/galling under launch vibrations.</li>
            <li><b>Manufacturing:</b> Monolithic CNC-machined frames offer maximum stiffness; skeleton frame builds allow modular panel integration.</li>
          </ul>
        </div>
        <div>
          <strong style="font-family: monospace;">Chassis Mounting Rules</strong>
          <ul>
            <li><b>Threaded Fasteners:</b> Never tap directly into raw aluminum. Use stainless steel Helicoils to prevent thread stripping.</li>
            <li><b>Thread Locking:</b> Standard vibration retention requires NASA-approved threadlockers (Loctite 242/222) or epoxy staking on screw heads.</li>
            <li><b>Off-Stack Payloads:</b> Heavy payloads or components like cameras or thrusters should be directly mounted to structural frame</li>
          </ul>
        </div>
      </div>
    `
  }
  {
    id: "pc104-bus",
    category: "Bus & Connectors",
    title: "PC/104 Stack Header Rules",
    date: "Electrical",
    image: "",
    imageCaption: "",
    content: `
      <p><b>Is PC/104 standard across all boards?</b></p>
      <ul style="padding-left: 18px; margin-top: 8px;">
        <li><b>Standard Bus Boards:</b> OBC, EPS, and Comms boards stack directly via 104-pin pass-through headers carrying power rails (3.3V, 5V, 12V) and data lines (CAN, I²C, SPI, UART).</li> </p>
    `
  }
];  

function renderWikiEntries(entries) {
  const container = document.getElementById('wiki-feed');
  if (!container) return;

  if (entries.length === 0) {
    container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; opacity: 0.6; font-family: monospace;">No matching notes found.</p>`;
    return;
  }

  container.innerHTML = entries.map(item => `
    <article class="update-card wiki-card" id="${item.id}">
      <div class="wiki-card-body">
        <div class="update-date">${item.category ? item.category.toUpperCase() : ''}</div>
        <h3>${item.title}</h3>

        ${item.image ? `
          <div class="video-thumb" style="margin: 12px 0;" onclick="openImageModal('${item.image}', '${item.title}')">
            <img src="${item.image}" alt="${item.title}">
          </div>
          ${item.imageCaption ? `<div class="wiki-media-caption">${item.imageCaption}</div>` : ''}
        ` : ''}

        <div>
          ${item.content}
        </div>
      </div>

      <div class="wiki-card-footer">
        ${item.date}
      </div>
    </article>
  `).join('');
}

function filterWiki() {
  const query = document.getElementById('wiki-search').value.toLowerCase();
  const filtered = wikiEntries.filter(item => 
    item.title.toLowerCase().includes(query) ||
    item.content.toLowerCase().includes(query) ||
    (item.category && item.category.toLowerCase().includes(query))
  );
  renderWikiEntries(filtered);
}

// Initial Render
renderWikiEntries(wikiEntries);


// ============================================================
// LIGHTBOX / MODAL LOGIC
// ============================================================
function openImageModal(src, alt) {
  const img = document.getElementById('lightbox-image');
  img.src = src;
  img.alt = alt;
  document.getElementById('image-modal').classList.remove('hidden');
}

function closeImageModal() {
  document.getElementById('image-modal').classList.add('hidden');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeImageModal();
});

const imageModal = document.getElementById('image-modal');
if (imageModal) {
  imageModal.addEventListener('click', (e) => {
    if (e.target === imageModal) closeImageModal();
  });
}
</script>

</body>
</html>
