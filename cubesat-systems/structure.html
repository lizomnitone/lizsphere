<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/lizsphere/">
<link rel="stylesheet" href="styles.css">
<title>CubeSat Structure & Reference Wiki</title>
<style>
  /* Local styles for the Wiki layout enhancements */
  .wiki-search-bar {
    max-width: 900px;
    margin: 0 auto 2rem auto;
    display: flex;
    gap: 1rem;
    align-items: center;
  }

  .wiki-search-input {
    flex: 1;
    padding: 0.75rem 1.25rem;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(15, 15, 25, 0.7);
    color: #fff;
    font-size: 1rem;
    backdrop-filter: blur(10px);
    outline: none;
    transition: border-color 0.3s ease;
  }

  .wiki-search-input:focus {
    border-color: #7a00ff;
  }

  /* 2-Column Grid Layout */
  .wiki-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  @media (max-width: 850px) {
    .wiki-grid {
      grid-template-columns: 1fr;
    }
  }

  /* Wiki Card Styles */
  .wiki-card {
    background: rgba(20, 20, 35, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 1.5rem;
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .wiki-card:hover {
    border-color: rgba(122, 0, 255, 0.5);
    transform: translateY(-2px);
  }

  .wiki-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }

  .wiki-title {
    margin: 0;
    font-size: 1.3rem;
    color: #fff;
  }

  .wiki-tag {
    background: linear-gradient(135deg, #ff0055, #7a00ff);
    color: #fff;
    font-size: 0.75rem;
    padding: 0.25rem 0.6rem;
    border-radius: 12px;
    white-space: nowrap;
    text-transform: uppercase;
    font-weight: bold;
    letter-spacing: 0.5px;
  }

  .wiki-media {
    margin: 1rem 0;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.15);
    position: relative;
  }

  .wiki-media img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }

  .wiki-media:hover img {
    transform: scale(1.03);
  }

  .wiki-media-caption {
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.6);
    text-align: center;
    margin-top: 0.3rem;
    font-style: italic;
  }

  /* Internal Multi-column layout helper for entries */
  .wiki-columns-inner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  @media (max-width: 500px) {
    .wiki-columns-inner {
      grid-template-columns: 1fr;
    }
  }

  .wiki-body {
    color: rgba(255, 255, 255, 0.85);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .wiki-body ul {
    padding-left: 1.2rem;
    margin: 0.5rem 0;
  }

  .wiki-footer-date {
    margin-top: 1rem;
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.4);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 0.75rem;
  }
</style>
</head>
<body>

<div class="page-container voicebox-page">

  <!-- HEADER -->
  <div class="home-header">
    <h1 class="home-header-title">CubeSat Structural Wiki</h1>
    <p>A free-form reference notebook for satellite design, mechanics, and subsystems.</p>
  </div>

  <!-- PINNED TOP-RIGHT BUBBLES -->
  <div class="bubbles-container bubbles-pinned-top-right" id="bubbles-container"></div>

  <!-- SEARCH BAR -->
  <div class="wiki-search-bar">
    <input type="text" id="wiki-search" class="wiki-search-input" placeholder="Search wiki notes, components, or form factors..." oninput="filterWiki()">
  </div>

  <!-- MAIN 2-COLUMN WIKI GRID -->
  <div class="wiki-grid" id="wiki-feed">
    <!-- Dynamic wiki entries populate here -->
  </div>
</div>

<!-- IMAGE LIGHTBOX MODAL -->
<div class="modal-overlay hidden" id="image-modal">
  <div class="modal-content image-modal-content">
    <button class="modal-close" onclick="closeImageModal()" aria-label="Close image">&times;</button>
    <img id="lightbox-image" src="" alt="">
  </div>
</div>

<script>
// ============================================================
// TOP-RIGHT NAVIGATION BUBBLES
// ============================================================
const bubbles = [
  {
    href: "index.html",
    label: "Back to Home",
    colors: ["#ff0055", "#7a00ff", "#7a00ff", "#ff0055"],
    size: 85,
    minFontSize: 14,
    pinned: true,
    floatDistance: 5,
  }, 
  {
    href: "satellite-home.html",
    label: "Sat Home",
    colors: ["#ff0055", "#7a00ff", "#7a00ff", "#ff0055"],
    size: 85,
    minFontSize: 14,
    pinned: true,
    floatDistance: 5,
  }
];

function randomBetween(min, max) {
  return Math.random() * (max - min) + min;
}

function randomColorSet() {
  const hue = Math.floor(randomBetween(0, 360));
  const c1 = `hsl(${hue}, 85%, 55%)`;
  const c2 = `hsl(${(hue + 90) % 360}, 85%, 55%)`;
  const c3 = `hsl(${(hue + 200) % 360}, 85%, 55%)`;
  return [c1, c2, c3, c1];
}

function fillDefaults(bubble) {
  return {
    href: bubble.href,
    label: bubble.label,
    size: bubble.size ?? Math.round(randomBetween(160, 280)),
    colors: bubble.colors ?? randomColorSet(),
    floatDistance: bubble.floatDistance ?? Math.round(randomBetween(15, 50)),
    floatAngle: bubble.floatAngle ?? Math.round(randomBetween(0, 360)),
    floatDuration: bubble.floatDuration ?? +randomBetween(4, 9).toFixed(1),
    rotateDuration: bubble.rotateDuration ?? Math.round(randomBetween(3000, 6000)),
  };
}

function createBubbleSVG(rawBubble, index) {
  const uid = `bubble-${index}`;
  const b = fillDefaults(rawBubble);
  const angleRad = (b.floatAngle * Math.PI) / 180;
  const floatX = (b.floatDistance * Math.cos(angleRad)).toFixed(1);
  const floatY = (b.floatDistance * Math.sin(angleRad)).toFixed(1);
  const [c1, c2, c3, c4] = b.colors;
  const wrapperStyle = `--float-x: ${floatX}px; --float-y: ${floatY}px; --float-duration: ${b.floatDuration}s;`;
  
  const calculatedFont = Math.round((b.size / 130) * 26);
  const minFont = rawBubble.minFontSize || 14;
  const textFontSize = Math.max(calculatedFont, minFont);

  const pinnedClass = b.pinned ? ' sphere-wrapper--pinned' : '';

  return `
    <a href="${b.href}" class="sphere-link${b.pinned ? ' sphere-link--pinned' : ''}">
      <div class="sphere-wrapper${pinnedClass}" style="${wrapperStyle}">
        <svg class="sphere-svg" data-gradient-id="grad-${uid}" data-rotate-duration="${b.rotateDuration}"
             viewBox="0 0 250 250" width="${b.size}" height="${b.size}">
          <defs>
            <filter id="warp-${uid}" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <clipPath id="clip-${uid}"><circle cx="125" cy="125" r="120" /></clipPath>
            <linearGradient id="grad-${uid}" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="repeat">
              <stop offset="0%" stop-color="${c1}" />
              <stop offset="33.3%" stop-color="${c2}" />
              <stop offset="66.6%" stop-color="${c3}" />
              <stop offset="100%" stop-color="${c4}" />
            </linearGradient>
            <radialGradient id="shading-${uid}" cx="40%" cy="35%" r="75%">
              <stop offset="0%" stop-color="#000000" stop-opacity="0" />
              <stop offset="65%" stop-color="#000000" stop-opacity="0" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
            </radialGradient>
            <radialGradient id="highlight-${uid}" cx="32%" cy="28%" r="30%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <filter id="shadow-${uid}" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
            </filter>
          </defs>
          <circle cx="125" cy="125" r="120" fill="#000000" opacity="0" filter="url(#shadow-${uid})" />
          <g clip-path="url(#clip-${uid})">
            <rect x="-20" y="-50" width="300" height="350" fill="url(#grad-${uid})" filter="url(#warp-${uid})" />
            <circle cx="125" cy="125" r="120" fill="url(#shading-${uid})" />
            <circle cx="125" cy="125" r="120" fill="url(#highlight-${uid})" />
          </g>
          <text class="bubble-text" x="125" y="125" text-anchor="middle" dominant-baseline="middle"
                style="font-size: ${textFontSize}px;">${b.label}</text>
        </svg>
      </div>
    </a>
  `;
}

document.getElementById('bubbles-container').innerHTML =
  bubbles.map((b, i) => createBubbleSVG(b, i)).join('');

let bubbleStartTime = null;
function animateAllGradients(timestamp) {
  if (!bubbleStartTime) bubbleStartTime = timestamp;
  const elapsed = timestamp - bubbleStartTime;
  document.querySelectorAll('[data-gradient-id]').forEach(svg => {
    const duration = Number(svg.dataset.rotateDuration) || 4000;
    const progress = (elapsed % duration) / duration;
    const gradEl = document.getElementById(svg.dataset.gradientId);
    if (gradEl) gradEl.setAttribute('gradientTransform', `translate(${-progress} 0)`);
  });
  requestAnimationFrame(animateAllGradients);
}
requestAnimationFrame(animateAllGradients);


// ============================================================
// FREE-FORM WIKI DATABASE
// ============================================================
const wikiEntries = [
  {
    id: "structural-form-factors",
    category: "Structure",
    title: "CubeSat Form Factors & Mass Classes",
    date: "Reference Note",
    image: "https://images.unsplash.com/photo-1517976487492-5750f3195933?auto=format&fit=crop&w=800&q=80",
    imageCaption: "Standard aluminum chassis frame & rails",
    content: `
      <div class="wiki-columns-inner">
        <div>
          <b>Standard 'U' Formats</b>
          <ul>
            <li><b>1U:</b> 10×10×11.35 cm (1.35cm accounts for deployer standoffs). Mass: ~1.3 - 2.0 kg.</li>
            <li><b>2U:</b> 10×10×22.7 cm</li>
            <li><b>3U:</b> 10×10×34.0 cm</li>
            <li><b>6U:</b> 10×20×34.0 cm</li>
            <li><b>12U:</b> 20×20×34.0 cm (or 10×20×68 cm)</li>
          </ul>
        </div>
        <div>
          <b>Broader Weight Classes</b>
          <ul>
            <li><b>Femtosat:</b> &lt;100g (e.g., ChipSats)</li>
            <li><b>Picosat:</b> 0.1kg - 1kg (1PQ = 5×5×5 cm)</li>
            <li><b>Nanosat:</b> 1kg - 10kg (1U–6U CubeSats)</li>
            <li><b>Microsat:</b> 10kg - 100kg (Custom platforms / 12U+)</li>
          </ul>
        </div>
      </div>
    `
  },
  {
    id: "comms-harnessing",
    category: "Comms & RF",
    title: "Remote Antenna Mounting & RF Coax Harnesses",
    date: "Design Tip",
    image: "",
    imageCaption: "",
    content: `
      <p>Comms boards and deployable antennas are frequently mounted on separate ends of the 3U structure:</p>
      <ul>
        <li><b>RF Connection:</b> Use thin micro-coaxial cable (U.FL / IPEX / SMA) rather than standard hookup wire to prevent signal loss & EMI.</li>
        <li><b>Cable Routing:</b> Secure cable along inner structural rails using Kapton tape or zip-tie anchors to prevent vibration snagging during launch.</li>
        <li><b>Placement:</b> Keep RF coax runs away from noisy switching regulators on the EPS board and high-current battery heaters.</li>
      </ul>
    `
  },
  {
    id: "pc104-bus",
    category: "Bus & Connectors",
    title: "PC/104 Stack Header Rules",
    date: "Electrical",
    image: "",
    imageCaption: "",
    content: `
      <p><b>Is PC/104 standard across all boards?</b></p>
      <ul>
        <li><b>Standard Bus Boards:</b> OBC, EPS, and Comms boards stack directly via 104-pin pass-through headers carrying power rails (3.3V, 5V, 12V) and data lines (CAN, I²C, SPI, UART).</li>
        <li><b>Optical / Large Payloads:</b> Cameras or optical telescopes taking up 1U+ volume are mounted off-stack directly to the chassis frame and interface with the PC/104 bus through a wire harness.</li>
      </ul>
    `
  }
];

function renderWikiEntries(entries) {
  const container = document.getElementById('wiki-feed');
  if (!container) return;

  if (entries.length === 0) {
    container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; opacity: 0.6;">No matching notes found.</p>`;
    return;
  }

  container.innerHTML = entries.map(item => `
    <article class="wiki-card" id="${item.id}">
      <div>
        <div class="wiki-header">
          <h2 class="wiki-title">${item.title}</h2>
          ${item.category ? `<span class="wiki-tag">${item.category}</span>` : ''}
        </div>

        ${item.image ? `
          <div class="wiki-media" onclick="openImageModal('${item.image}', '${item.title}')">
            <img src="${item.image}" alt="${item.title}">
          </div>
          ${item.imageCaption ? `<div class="wiki-media-caption">${item.imageCaption}</div>` : ''}
        ` : ''}

        <div class="wiki-body">
          ${item.content}
        </div>
      </div>

      <div class="wiki-footer-date">
        ${item.date}
      </div>
    </article>
  `).join('');
}

function filterWiki() {
  const query = document.getElementById('wiki-search').value.toLowerCase();
  const filtered = wikiEntries.filter(item => 
    item.title.toLowerCase().includes(query) ||
    item.content.toLowerCase().includes(query) ||
    (item.category && item.category.toLowerCase().includes(query))
  );
  renderWikiEntries(filtered);
}

// Initial Render
renderWikiEntries(wikiEntries);


// ============================================================
// LIGHTBOX / MODAL LOGIC
// ============================================================
function openImageModal(src, alt) {
  const img = document.getElementById('lightbox-image');
  img.src = src;
  img.alt = alt;
  document.getElementById('image-modal').classList.remove('hidden');
}

function closeImageModal() {
  document.getElementById('image-modal').classList.add('hidden');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeImageModal();
});

const imageModal = document.getElementById('image-modal');
if (imageModal) {
  imageModal.addEventListener('click', (e) => {
    if (e.target === imageModal) closeImageModal();
  });
}
</script>

</body>
</html>
