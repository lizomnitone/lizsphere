<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/lizsphere/">
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<link rel="stylesheet" href="styles.css">
<title>Shuffle</title>

<style>
  .shuffle-wrap { max-width: 900px; margin: 0 auto; }
  .player-frame {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #000; border: 2px solid #ff0077; border-radius: 10px; overflow: hidden;
  }
  .player-frame iframe, .player-frame #player { position: absolute; inset: 0; width: 100%; height: 100%; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  .controls button {
    font-family: monospace; font-size: 1rem; cursor: pointer;
    padding: 10px 18px; border-radius: 8px;
    border: 1px solid #ff0077; background: rgba(255, 0, 119, 0.2); color: #000;
  }
  .controls button:hover, .controls button:focus-visible { background: rgba(255, 0, 119, 0.4); }
  .status { font-family: monospace; opacity: 0.7; margin-top: 12px; min-height: 1.5em; }
  .ch { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .ch.active { opacity: 1; pointer-events: auto; z-index: 1; }
  #static { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;
    image-rendering: pixelated; opacity: 0; transition: opacity .08s; }
  #static.on { opacity: 1; }
  #osd { position: absolute; top: 14px; left: 18px; z-index: 3; pointer-events: none;
    font-family: monospace; font-weight: 700; font-size: clamp(1rem, 3.5vw, 1.8rem); color: #7dff7d;
    text-shadow: 2px 2px 0 #000, 0 0 8px rgba(125,255,125,.6); opacity: 0; transition: opacity .4s; }
  #osd.on { opacity: 1; transition: none; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 14px; }
  .chip {
    font-family: monospace; font-size: 0.9rem; cursor: pointer; padding: 8px 12px; border-radius: 8px; text-align: left;
    border: 1px solid #ff0077; background: transparent; color: #000;
  }
  .chip .num { opacity: .6; margin-right: 8px; }
  .chip.active .num { opacity: 1; }
  .chip:hover { background: rgba(255, 0, 119, 0.2); }
  .chip.active { background: #ff0077; color: #fff; }
  .hint { font-family: monospace; font-size: 0.85rem; opacity: 0.6; margin-top: 6px; }
</style>
</head>
<body>

<div class="page-container">
  <div class="home-header">
    <h1 class="home-header-title">Shuffle</h1>
    <p>a random pick from my playlists. pick a channel. every channel is playing at once.</p>
  </div>

  <div class="shuffle-wrap">
    <div class="player-frame"><div id="stage"></div><canvas id="static" width="192" height="108"></canvas><div id="osd"></div></div>

    <div class="controls">
      <button id="ch-down">CH ▼</button>
      <button id="ch-up">CH ▲</button>
      <button id="next">🎲 Next random</button>
      <button id="prev">⏮ Previous</button>
      <button id="rand-start">Start at random time: <span id="rs-state">on</span></button>
    </div>

    <div class="status" id="status">Loading…</div>

    <div class="chips" id="chips"></div>

    <div class="hint">Keys: ↑ / ↓ = change channel, → or N = next video, ← or P = previous</div>
  </div>
</div>

<script>
  // Videos + channels live in data/playlist-topics.json (edit that file to re-sort).
  // Every channel gets its own player and keeps playing in the background (muted),
  // so changing channel just unmutes one -- no new video load, so no new pre-roll ad.
  const STAGGER_MS = 1200;      // delay between starting each channel's player
  let channels = [], active = 0, randomStart = true, ytReady = false, unmuted = false;
  const statusEl = document.getElementById('status');
  const chipsEl = document.getElementById('chips');
  const stageEl = document.getElementById('stage');
  const staticEl = document.getElementById('static'), osdEl = document.getElementById('osd');
  const sctx = staticEl.getContext('2d');
  let staticTimer, osdTimer;

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  const dataReady = fetch('data/playlist-topics.json').then(r => r.json()).then(d => {
    channels = Object.values(d.topics).filter(t => t.videos.length).map((t, i) => ({
      name: t.name, videos: t.videos, hist: [], pos: -1, player: null, ready: false, cur: null
    }));
    buildChips();
    channels.forEach((c, i) => {
      c.el = document.createElement('div'); c.el.className = 'ch';
      c.el.innerHTML = `<div id="yt-${i}"></div>`;
      stageEl.appendChild(c.el);
    });
    setActiveUI();
  }).catch(() => { statusEl.textContent = 'Could not load data/playlist-topics.json (open the page via a web server, not file://).'; });

  window.onYouTubeIframeAPIReady = function () {
    ytReady = true;
    dataReady.then(() => {
      // Start the visible channel first, then the rest one at a time.
      const order = channels.map((_, i) => i).sort((a, b) => (a === active ? -1 : b === active ? 1 : a - b));
      order.forEach((i, n) => setTimeout(() => startChannel(i), n * STAGGER_MS));
    });
  };

  function pick(c) {
    let v;
    do { v = c.videos[Math.floor(Math.random() * c.videos.length)]; }
    while (c.videos.length > 1 && c.cur && v.id === c.cur.id);
    return v;
  }
  const startSec = () => randomStart ? Math.floor(Math.random() * 120) : 0;

  function startChannel(i) {
    const c = channels[i], v = pick(c);
    c.cur = v; c.hist.push(v); c.pos = 0;
    c.player = new YT.Player(`yt-${i}`, {
      width: '100%', height: '100%', videoId: v.id,
      playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0, start: startSec() },
      events: {
        onReady: (e) => { c.ready = true; e.target.mute(); e.target.playVideo(); if (i === active) applyAudio(); },
        onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) nextIn(i); },
        onError: () => setTimeout(() => nextIn(i), 800)
      }
    });
  }

  function loadIn(i, v) {
    const c = channels[i]; c.cur = v;
    c.player.loadVideoById({ videoId: v.id, startSeconds: startSec() });
    if (i !== active) c.player.mute();
    if (i === active) { flashStatic(250); showStatus(); }
  }

  function nextIn(i) {
    const c = channels[i]; if (!c.ready) return;
    if (c.pos < c.hist.length - 1) { c.pos++; loadIn(i, c.hist[c.pos]); return; }
    const v = pick(c); c.hist.push(v); c.pos = c.hist.length - 1; loadIn(i, v);
  }
  function prevIn(i) { const c = channels[i]; if (c.ready && c.pos > 0) { c.pos--; loadIn(i, c.hist[c.pos]); } }

  // Only the active channel is audible.
  function applyAudio() {
    channels.forEach((c, i) => {
      if (!c.ready) return;
      if (i === active && unmuted) { c.player.unMute(); c.player.setVolume(100); }
      else c.player.mute();
      if (i === active) c.player.playVideo();
    });
  }

  function setChannel(i, flash = true) {
    if (!channels.length) return;
    active = (i + channels.length) % channels.length;
    setActiveUI(); applyAudio();
    if (flash) {
      flashStatic();
      showOsd(`CH ${String(active + 1).padStart(2, '0')}  ${channels[active].name}`);
    }
    showStatus();
  }

  function setActiveUI() {
    channels.forEach((c, i) => c.el && c.el.classList.toggle('active', i === active));
    chipsEl.querySelectorAll('.chip').forEach((b, i) => b.classList.toggle('active', i === active));
  }

  function showStatus() {
    const c = channels[active];
    statusEl.textContent = !c ? 'Loading…' : !c.ready ? `Tuning in to ${c.name}…`
      : (unmuted ? '' : '🔇 click anywhere to unmute — ') + `${c.cur.title} — ${c.cur.channel}`;
  }
  setInterval(showStatus, 1000);

  function buildChips() {
    channels.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.innerHTML = `<span class="num">${String(i + 1).padStart(2, '0')}</span><span class="lbl"></span>`;
      b.querySelector('.lbl').textContent = c.name;
      b.onclick = () => { unlockAudio(); setChannel(i); };
      chipsEl.appendChild(b);
    });
  }

  function flashStatic(ms = 450) {
    clearInterval(staticTimer);
    staticEl.classList.add('on');
    staticTimer = setInterval(() => {
      const img = sctx.createImageData(192, 108), d = img.data;
      for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255; }
      sctx.putImageData(img, 0, 0);
    }, 50);
    setTimeout(() => { clearInterval(staticTimer); staticEl.classList.remove('on'); }, ms);
  }
  function showOsd(text) {
    osdEl.textContent = text; osdEl.classList.add('on');
    clearTimeout(osdTimer); osdTimer = setTimeout(() => osdEl.classList.remove('on'), 2500);
  }

  // Browsers only allow sound after a click/tap on the page.
  function unlockAudio() { if (!unmuted) { unmuted = true; applyAudio(); showStatus(); } }
  document.addEventListener('pointerdown', unlockAudio);
  document.addEventListener('keydown', unlockAudio);

  document.getElementById('ch-up').onclick = () => setChannel(active + 1);
  document.getElementById('ch-down').onclick = () => setChannel(active - 1);
  document.getElementById('next').onclick = () => nextIn(active);
  document.getElementById('prev').onclick = () => prevIn(active);
  document.getElementById('rand-start').onclick = () => {
    randomStart = !randomStart;
    document.getElementById('rs-state').textContent = randomStart ? 'on' : 'off';
  };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'n' || e.key === 'ArrowRight') nextIn(active);
    if (e.key === 'p' || e.key === 'ArrowLeft') prevIn(active);
    if (e.key === 'ArrowUp') { e.preventDefault(); setChannel(active + 1); }
    if (e.key === 'ArrowDown') { e.preventDefault(); setChannel(active - 1); }
  });
</script>

</body>
</html>
