<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/lizsphere/">
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<link rel="stylesheet" href="styles.css">
<title>Home</title>

<!-- Extra styles needed by the drag/physics. Self-contained so styles.css needs no changes. -->
<style>
  .drag-layer {
    display: inline-block;
    position: relative;
    touch-action: none;          /* touch-drags don't scroll the page */
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }
  .drag-layer.dragging { cursor: grabbing; }
  .sphere-link { -webkit-user-drag: none; }
  .sphere-svg { display: block; } /* removes the small baseline gap under inline SVGs */
</style>
</head>
<body>

<div class="page-container">
<div class="home-header">
<h1 class="home-header-title">Hi, I'm Liz</h1>
<p>Welcome to my digital sphere(s)</p>
</div>

<div class="bubbles-container" id="bubbles-container"></div>
</div>

<script>
// --- 1. Define your bubbles here. Any field you omit gets randomized. ---
const bubbles = [
  {
    href: "satellite-home.html",
    label: "Satellites",
    size: 220,
  },
  {
    href: "synthesizers.html",
    label: "Synthesizers",
    size: 260,
    colors: ["#ff0055", "#00daff", "#7a00ff", "#ff0055"],
  },
  {
    href: "design-gallery.html",
    label: "Design Gallery",
    size: 200,
    colors: ["#ffb703", "#fb8500", "#ff006e", "#ffb703"],
  },
  {
    href: "artwork.html",
    label: "Artwork",
    size: 230,
  },
  {
    href: "https://ca.pinterest.com/lizizthename/",
    label: "Pinterest",
    size: 180,
  },
  {
    href: "workshops.html",
    label: "Workshops around Town",
    size: 180,
    colors: ["#ffb703", "#fb8500", "#ff006e", "#ffb703"],
  },
];

// --- 2. Randomization helpers + fallback ranges ---
function randomBetween(min, max) {
  return Math.random() * (max - min) + min;
}

function randomColorSet() {
  const hue = Math.floor(randomBetween(0, 360));
  const c1 = `hsl(${hue}, 85%, 55%)`;
  const c2 = `hsl(${(hue + 90) % 360}, 85%, 55%)`;
  const c3 = `hsl(${(hue + 200) % 360}, 85%, 55%)`;
  return [c1, c2, c3, c1];
}

function fillDefaults(bubble) {
  return {
    href: bubble.href,
    label: bubble.label,
    size: bubble.size ?? Math.round(randomBetween(160, 280)),
    colors: bubble.colors ?? randomColorSet(),
    floatDistance: bubble.floatDistance ?? Math.round(randomBetween(15, 50)),
    floatAngle: bubble.floatAngle ?? Math.round(randomBetween(0, 360)),
    floatDuration: bubble.floatDuration ?? +randomBetween(4, 9).toFixed(1),
    rotateDuration: bubble.rotateDuration ?? Math.round(randomBetween(3000, 6000)),
  };
}

// --- 3. Template: builds one bubble's markup (now wrapped in a .drag-layer) ---
function createBubbleSVG(rawBubble, index) {
  const uid = `bubble-${index}`;
  const b = fillDefaults(rawBubble);

  const angleRad = (b.floatAngle * Math.PI) / 180;
  const floatX = (b.floatDistance * Math.cos(angleRad)).toFixed(1);
  const floatY = (b.floatDistance * Math.sin(angleRad)).toFixed(1);

  const [c1, c2, c3, c4] = b.colors;

  const wrapperStyle = `
    --float-x: ${floatX}px;
    --float-y: ${floatY}px;
    --float-duration: ${b.floatDuration}s;
  `.replace(/\s+/g, ' ');

  const textFontSize = Math.round((b.size / 270) * 22);

  return `
    <div class="drag-layer">
    <a href="${b.href}" class="sphere-link">
      <div class="sphere-wrapper" style="${wrapperStyle}">
        <svg class="sphere-svg" data-gradient-id="grad-${uid}" data-rotate-duration="${b.rotateDuration}"
             viewBox="0 0 250 250" width="${b.size}" height="${b.size}">
          <defs>
            <filter id="warp-${uid}" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" />
            </filter>

            <clipPath id="clip-${uid}">
              <circle cx="125" cy="125" r="120" />
            </clipPath>

            <linearGradient id="grad-${uid}" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="repeat">
              <stop offset="0%" stop-color="${c1}" />
              <stop offset="33.3%" stop-color="${c2}" />
              <stop offset="66.6%" stop-color="${c3}" />
              <stop offset="100%" stop-color="${c4}" />
            </linearGradient>

            <radialGradient id="shading-${uid}" cx="40%" cy="35%" r="75%">
              <stop offset="0%" stop-color="#000000" stop-opacity="0" />
              <stop offset="65%" stop-color="#000000" stop-opacity="0" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
            </radialGradient>

            <radialGradient id="highlight-${uid}" cx="32%" cy="28%" r="30%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>

            <filter id="shadow-${uid}" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
            </filter>
          </defs>

          <circle cx="125" cy="125" r="120" fill="#000000" opacity="0" filter="url(#shadow-${uid})" />

          <g clip-path="url(#clip-${uid})">
            <rect x="-20" y="-50" width="300" height="350" fill="url(#grad-${uid})" filter="url(#warp-${uid})" />
            <circle cx="125" cy="125" r="120" fill="url(#shading-${uid})" />
            <circle cx="125" cy="125" r="120" fill="url(#highlight-${uid})" />
          </g>

          <text class="bubble-text" x="125" y="125" text-anchor="middle" dominant-baseline="middle"
                style="font-size: ${textFontSize}px;">
            ${b.label}
          </text>
        </svg>
      </div>
    </a>
    </div>
  `;
}

// --- 4. Render all bubbles into the container ---
const container = document.getElementById('bubbles-container');
container.innerHTML = bubbles.map((b, i) => createBubbleSVG(b, i)).join('');

// --- 5. One animation loop drives ALL gradients, each at its own rotateDuration ---
let startTime = null;

function animateAllGradients(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;

  document.querySelectorAll('[data-gradient-id]').forEach(svg => {
    const gradId = svg.dataset.gradientId;
    const duration = Number(svg.dataset.rotateDuration) || 4000;
    const progress = (elapsed % duration) / duration;
    const gradEl = document.getElementById(gradId);
    if (gradEl) gradEl.setAttribute('gradientTransform', `translate(${-progress} 0)`);
  });

  requestAnimationFrame(animateAllGradients);
}

requestAnimationFrame(animateAllGradients);

// --- 6. Bubble physics: drag + bouncing + squish ---
// All the tuning numbers live here. These are starting guesses; adjust by feel.
const CFG = {
  dragThreshold: 5,          // px of movement before a press counts as a drag
  stiffness: 30,             // drag spring: lower = more lag/resistance
  damping: 10,                // drag spring: higher = less wobble
  friction: 0.8,             // per-second slowdown after release; higher = stops sooner
  maxSpeed: 1200,            // px/s cap
  stretchPerSpeed: 0.0001,   // stretch along direction of motion, per px/s
  maxStretch: 0.18,
  homePull: 0,               // >0 slowly drifts bubbles back to their start spots (try 0.3)
  restSpeed: 2,              // px/s below which the loop sleeps
  bubbleRestitution: 0.55,   // bounciness off other bubbles (1 = perfectly elastic)
  wallRestitution: 0.5,      // bounciness off walls
  contactSoftness: 0.6,      // fraction of overlap fixed per pass; 1 = rigid, lower = squishier
  hitRadiusRatio: 0.48,      // collision radius = 0.48 x svg size (circle r=120 in a 250 viewBox)
  collisionPasses: 2,
  squishKick: 0.004,         // squish added per px/s of impact speed
  squishMinSpeed: 30,        // px/s; ignores gentle resting contact
  squishStiffness: 250,      // higher = snappier return to round
  squishDamping: 10,         // lower = more jiggle
  maxSquish: 0.25            // 0.25 = up to 25% compression
};

// Respect reduced-motion: no stretch/squish, and bubbles settle quickly.
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  CFG.stretchPerSpeed = 0;
  CFG.squishKick = 0;
  CFG.friction = 6;
}

let zCounter = 1;
const states = [];
let rafId = null;
let lastTs = 0;
const bounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };

// Walls = the visible window on all four sides (bottom of window is the floor).
function updateBounds() {
  bounds.minX = 0;
  bounds.maxX = document.documentElement.clientWidth;
  bounds.minY = 0;
  bounds.maxY = window.innerHeight;
}

// offsetLeft/Top ignore transforms, so these are each bubble's pre-drag layout spot.
function updateNaturalPositions() {
  for (const s of states) {
    s.nx = s.layer.offsetLeft + s.size / 2;
    s.ny = s.layer.offsetTop + s.size / 2;
  }
}

function kick(s, speed, ang) {
  if (speed < CFG.squishMinSpeed) return;
  s.sqAng = ang;
  s.sqv += speed * CFG.squishKick;
}

function render(s) {
  const speed = Math.hypot(s.vx, s.vy);
  const k = Math.min(speed * CFG.stretchPerSpeed, CFG.maxStretch);
  const ang = Math.atan2(s.vy, s.vx);
  const q = s.sq;
  s.layer.style.transform =
    `translate3d(${s.x}px, ${s.y}px, 0) ` +
    `rotate(${ang}rad) scale(${1 + k}, ${1 / (1 + k)}) rotate(${-ang}rad) ` +
    `rotate(${s.sqAng}rad) scale(${1 - q}, ${1 / (1 - q)}) rotate(${-s.sqAng}rad)`;
}

function collideBubbles() {
  for (let i = 0; i < states.length; i++) {
    for (let j = i + 1; j < states.length; j++) {
      const a = states[i], b = states[j];
      const dx = (b.nx + b.x) - (a.nx + a.x);
      const dy = (b.ny + b.y) - (a.ny + a.y);
      const minD = a.r + b.r;
      if (dx * dx + dy * dy >= minD * minD) continue;

      const dist = Math.hypot(dx, dy) || 0.0001;
      const nx = dx / dist, ny = dy / dist;
      const ia = a.held ? 0 : 1 / a.m;   // held bubble acts as immovable
      const ib = b.held ? 0 : 1 / b.m;
      const sum = ia + ib;
      if (sum === 0) continue;

      const overlap = (minD - dist) * CFG.contactSoftness;
      a.x -= nx * overlap * ia / sum;  a.y -= ny * overlap * ia / sum;
      b.x += nx * overlap * ib / sum;  b.y += ny * overlap * ib / sum;

      const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rel < 0) {
        const imp = -(1 + CFG.bubbleRestitution) * rel / sum;
        a.vx -= imp * ia * nx;  a.vy -= imp * ia * ny;
        b.vx += imp * ib * nx;  b.vy += imp * ib * ny;
        const axis = Math.atan2(ny, nx);
        kick(a, -rel, axis);
        kick(b, -rel, axis);
      }
    }
  }
}

function collideWalls(s) {
  const cx = s.nx + s.x, cy = s.ny + s.y;
  const lo = bounds.minX + s.r, hi = bounds.maxX - s.r;
  const top = bounds.minY + s.r, bot = bounds.maxY - s.r;
  if (cx < lo)       { s.x += lo - cx;  if (s.vx < 0) { kick(s, -s.vx, 0);           s.vx = -s.vx * CFG.wallRestitution; } }
  else if (cx > hi)  { s.x += hi - cx;  if (s.vx > 0) { kick(s, s.vx, 0);            s.vx = -s.vx * CFG.wallRestitution; } }
  if (cy < top)      { s.y += top - cy; if (s.vy < 0) { kick(s, -s.vy, Math.PI / 2); s.vy = -s.vy * CFG.wallRestitution; } }
  else if (cy > bot) { s.y += bot - cy; if (s.vy > 0) { kick(s, s.vy, Math.PI / 2);  s.vy = -s.vy * CFG.wallRestitution; } }
}

function step(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05); // clamp so tab-switches don't explode the sim
  lastTs = ts;

  // 1. integrate motion + squish spring
  for (const s of states) {
    s.held = s.pressed && s.dragged;
    if (s.held) {
      s.vx += (CFG.stiffness * (s.tx - s.x) - CFG.damping * s.vx) * dt;
      s.vy += (CFG.stiffness * (s.ty - s.y) - CFG.damping * s.vy) * dt;
    } else {
      const f = Math.exp(-CFG.friction * dt);
      s.vx *= f; s.vy *= f;
      if (CFG.homePull) {
        s.vx -= CFG.homePull * s.x * dt;
        s.vy -= CFG.homePull * s.y * dt;
      }
    }
    const sp = Math.hypot(s.vx, s.vy);
    if (sp > CFG.maxSpeed) { s.vx *= CFG.maxSpeed / sp; s.vy *= CFG.maxSpeed / sp; }
    s.x += s.vx * dt;
    s.y += s.vy * dt;

    const sa = -CFG.squishStiffness * s.sq - CFG.squishDamping * s.sqv;
    s.sqv += sa * dt;
    s.sq  += s.sqv * dt;
    s.sq = Math.max(-0.12, Math.min(CFG.maxSquish, s.sq));
  }

  // 2. resolve collisions (walls last so nothing ends up outside the frame)
  for (let p = 0; p < CFG.collisionPasses; p++) {
    collideBubbles();
    for (const s of states) collideWalls(s);
  }

  // 3. draw + decide whether to keep looping
  let active = false;
  for (const s of states) {
    const speed = Math.hypot(s.vx, s.vy);
    render(s);
    const homeDist = CFG.homePull ? Math.hypot(s.x, s.y) : 0;
    const wobbling = Math.abs(s.sq) > 0.002 || Math.abs(s.sqv) > 0.02;
    if (s.pressed || speed > CFG.restSpeed || homeDist > 0.5 || wobbling) active = true;
    else { s.vx = s.vy = 0; s.sq = s.sqv = 0; render(s); }
  }
  rafId = active ? requestAnimationFrame(step) : null;
}

function wake() {
  if (rafId === null) {
    lastTs = performance.now();
    rafId = requestAnimationFrame(step);
  }
}

container.querySelectorAll('.drag-layer').forEach(layer => {
  const size = Number(layer.querySelector('svg').getAttribute('width'));
  const r = size * CFG.hitRadiusRatio;
  const s = {
    layer, size, r, m: r * r,
    wrapper: layer.querySelector('.sphere-wrapper'),
    nx: 0, ny: 0,                 // natural (layout) center
    x: 0, y: 0, vx: 0, vy: 0,     // offset from natural spot, and velocity
    tx: 0, ty: 0,                 // spring target while dragging
    sq: 0, sqv: 0, sqAng: 0,      // impact squish amount, its velocity, its axis
    startX: 0, startY: 0, baseX: 0, baseY: 0,
    pressed: false, dragged: false, held: false
  };
  states.push(s);

  layer.addEventListener('dragstart', e => e.preventDefault());

  layer.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    s.pressed = true;
    s.dragged = false;
    s.startX = e.clientX; s.startY = e.clientY;
    s.baseX = s.x;        s.baseY = s.y;
    s.tx = s.x;           s.ty = s.y;
    layer.setPointerCapture(e.pointerId);
    wake();
  });

  layer.addEventListener('pointermove', e => {
    if (!s.pressed) return;
    const dx = e.clientX - s.startX;
    const dy = e.clientY - s.startY;
    if (!s.dragged) {
      if (Math.hypot(dx, dy) < CFG.dragThreshold) return;
      s.dragged = true;
      layer.classList.add('dragging');
      layer.style.zIndex = ++zCounter;
      s.wrapper.style.animationPlayState = 'paused';
    }
    s.tx = s.baseX + dx;
    s.ty = s.baseY + dy;
  });

  const endPress = () => {
    if (!s.pressed) return;
    s.pressed = false;
    layer.classList.remove('dragging');
    s.wrapper.style.animationPlayState = '';
    setTimeout(() => { s.dragged = false; }, 0); // lets the trailing click be suppressed
    wake();
  };
  layer.addEventListener('pointerup', endPress);
  layer.addEventListener('pointercancel', endPress);

  // Swallow the click that follows a drag so it doesn't navigate
  layer.addEventListener('click', e => {
    if (s.dragged) { e.preventDefault(); e.stopPropagation(); }
  }, true);
});

updateBounds();
updateNaturalPositions();
window.addEventListener('resize', () => {
  updateBounds();
  updateNaturalPositions();
  wake();
});
</script>

</body>
</html>
