<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/lizsphere/">
<link rel="stylesheet" href="styles.css">
<title>CubeSat Structure!</title>
</head>
<body>

<div class="page-container voicebox-page">

  <!-- HEADER -->
  <div class="home-header">
    <h1 class="home-header-title">Cubesat Structure</h1>
    <p>What I've picked up is important for CubeSat structural design</p>
  </div>

  <!-- PINNED TOP-RIGHT BUBBLES -->
  <div class="bubbles-container bubbles-pinned-top-right" id="bubbles-container"></div>

  <!-- MAIN BLOG FEED GRID -->
  <div class="updates-feed-layout">
    
    <!-- Feed Column -->
    <div class="updates-feed" id="updates-feed">
      <!-- Dynamic updates populate here -->
    </div>

  </div>

</div>

<!-- IMAGE LIGHTBOX MODAL (For inline post images) -->
<div class="modal-overlay hidden" id="image-modal">
  <div class="modal-content image-modal-content">
    <button class="modal-close" onclick="closeImageModal()" aria-label="Close image">&times;</button>
    <img id="lightbox-image" src="" alt="">
  </div>
</div>

<script>
// ============================================================
// TOP-RIGHT NAVIGATION BUBBLES
// ============================================================
const bubbles = [
  {
    href: "index.html",
    label: "Back to Home",
    colors: ["#ff0055", "#7a00ff", "#7a00ff", "#ff0055"],
    size: 85,
    minFontSize: 14,
    pinned: true,
    floatDistance: 5,
  }, 
  {
    href: "satellite-home.html",
    label: "Sat Home",
    colors: ["#ff0055", "#7a00ff", "#7a00ff", "#ff0055"],
    size: 85,
    minFontSize: 14,
    pinned: true,
    floatDistance: 5,
  }
];

function randomBetween(min, max) {
  return Math.random() * (max - min) + min;
}

function randomColorSet() {
  const hue = Math.floor(randomBetween(0, 360));
  const c1 = `hsl(${hue}, 85%, 55%)`;
  const c2 = `hsl(${(hue + 90) % 360}, 85%, 55%)`;
  const c3 = `hsl(${(hue + 200) % 360}, 85%, 55%)`;
  return [c1, c2, c3, c1];
}

function fillDefaults(bubble) {
  return {
    href: bubble.href,
    label: bubble.label,
    size: bubble.size ?? Math.round(randomBetween(160, 280)),
    colors: bubble.colors ?? randomColorSet(),
    floatDistance: bubble.floatDistance ?? Math.round(randomBetween(15, 50)),
    floatAngle: bubble.floatAngle ?? Math.round(randomBetween(0, 360)),
    floatDuration: bubble.floatDuration ?? +randomBetween(4, 9).toFixed(1),
    rotateDuration: bubble.rotateDuration ?? Math.round(randomBetween(3000, 6000)),
  };
}

function createBubbleSVG(rawBubble, index) {
  const uid = `bubble-${index}`;
  const b = fillDefaults(rawBubble);
  const angleRad = (b.floatAngle * Math.PI) / 180;
  const floatX = (b.floatDistance * Math.cos(angleRad)).toFixed(1);
  const floatY = (b.floatDistance * Math.sin(angleRad)).toFixed(1);
  const [c1, c2, c3, c4] = b.colors;
  const wrapperStyle = `--float-x: ${floatX}px; --float-y: ${floatY}px; --float-duration: ${b.floatDuration}s;`;
  
  const calculatedFont = Math.round((b.size / 130) * 26);
  const minFont = rawBubble.minFontSize || 14;
  const textFontSize = Math.max(calculatedFont, minFont);

  const pinnedClass = b.pinned ? ' sphere-wrapper--pinned' : '';

  return `
    <a href="${b.href}" class="sphere-link${b.pinned ? ' sphere-link--pinned' : ''}">
      <div class="sphere-wrapper${pinnedClass}" style="${wrapperStyle}">
        <svg class="sphere-svg" data-gradient-id="grad-${uid}" data-rotate-duration="${b.rotateDuration}"
             viewBox="0 0 250 250" width="${b.size}" height="${b.size}">
          <defs>
            <filter id="warp-${uid}" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <clipPath id="clip-${uid}"><circle cx="125" cy="125" r="120" /></clipPath>
            <linearGradient id="grad-${uid}" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="repeat">
              <stop offset="0%" stop-color="${c1}" />
              <stop offset="33.3%" stop-color="${c2}" />
              <stop offset="66.6%" stop-color="${c3}" />
              <stop offset="100%" stop-color="${c4}" />
            </linearGradient>
            <radialGradient id="shading-${uid}" cx="40%" cy="35%" r="75%">
              <stop offset="0%" stop-color="#000000" stop-opacity="0" />
              <stop offset="65%" stop-color="#000000" stop-opacity="0" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
            </radialGradient>
            <radialGradient id="highlight-${uid}" cx="32%" cy="28%" r="30%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <filter id="shadow-${uid}" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
            </filter>
          </defs>
          <circle cx="125" cy="125" r="120" fill="#000000" opacity="0" filter="url(#shadow-${uid})" />
          <g clip-path="url(#clip-${uid})">
            <rect x="-20" y="-50" width="300" height="350" fill="url(#grad-${uid})" filter="url(#warp-${uid})" />
            <circle cx="125" cy="125" r="120" fill="url(#shading-${uid})" />
            <circle cx="125" cy="125" r="120" fill="url(#highlight-${uid})" />
          </g>
          <text class="bubble-text" x="125" y="125" text-anchor="middle" dominant-baseline="middle"
                style="font-size: ${textFontSize}px;">${b.label}</text>
        </svg>
      </div>
    </a>
  `;
}

document.getElementById('bubbles-container').innerHTML =
  bubbles.map((b, i) => createBubbleSVG(b, i)).join('');

let bubbleStartTime = null;
function animateAllGradients(timestamp) {
  if (!bubbleStartTime) bubbleStartTime = timestamp;
  const elapsed = timestamp - bubbleStartTime;
  document.querySelectorAll('[data-gradient-id]').forEach(svg => {
    const duration = Number(svg.dataset.rotateDuration) || 4000;
    const progress = (elapsed % duration) / duration;
    const gradEl = document.getElementById(svg.dataset.gradientId);
    if (gradEl) gradEl.setAttribute('gradientTransform', `translate(${-progress} 0)`);
  });
  requestAnimationFrame(animateAllGradients);
}
requestAnimationFrame(animateAllGradients);


// ============================================================
// ALL BLOG POSTS DATA
// ============================================================
const allUpdates = [

    {
    date: "Form Factors",
    id: "structural-1",
    title: "Standard Convention for CubeSat Form Factors!",
    content: `
      <p>
        <b>'U' Formats </b><br>
        1U: 10cmx10cmx11.35cm (1.35cm accounts for standardized standoff feet, it's basically 10x10x10). 1.3kg-2.0kg / U <br>
        2U: 10cmx10xmx22.7cm <br>
        3U: 10cmx10cm34cm <br>
        6U: 10cmx20cmx34cm <br>
        12U: 20cmx20cmx34cm (or 10x20x68)<br>
        <br>
        <b>Broader Satellite Weight Classes: </b><br>
        Femtosat: <100g (e.g., ChipSats)<br>
        Picosat: 0.1kg-1kg (includes PocketQubes, e.g., 1PQ = 5cmx5cmx5cm)<br>
        Nanosat: 1kg-10kg (most 1U-6U CubeSats fall here)<br>
        Microsat: 10kg-100kg (larger custom platforms, 12U/16U borders on this)<br>
      </p>
      `
    },
 


];

function renderFullFeed() {
  const container = document.getElementById('updates-feed');
  if (!container) return;
  container.innerHTML = allUpdates.map(post => `
    <article class="update-card full-post" id="${post.id}">
      <div class="update-date">${post.date}</div>
      <h2>${post.title}</h2>
      <div class="post-body">${post.content}</div>
    </article>
  `).join('');
}
renderFullFeed();


// ============================================================
// LIGHTBOX / MODAL LOGIC
// ============================================================
function openImageModal(src, alt) {
  const img = document.getElementById('lightbox-image');
  img.src = src;
  img.alt = alt;
  document.getElementById('image-modal').classList.remove('hidden');
}

function closeImageModal() {
  document.getElementById('image-modal').classList.add('hidden');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeImageModal();
});

const imageModal = document.getElementById('image-modal');
if (imageModal) {
  imageModal.addEventListener('click', (e) => {
    if (e.target === imageModal) closeImageModal();
  });
}
</script>

</body>
</html>
